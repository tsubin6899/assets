<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>個人財務中心｜阿斌 Tsubin</title>
  <meta name="theme-color" content="#18243a">
  <meta name="application-name" content="個人財務中心">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <style>
    :root { color-scheme: light; --ink:#18243a; --muted:#69778c; --blue:#4d82ff; --green:#20b486; --header:#17284b; --header-2:#235dc8; --header-3:#138d8a; }
    * { box-sizing: border-box; }
    html, body { height:100%; min-height:100%; margin:0; overflow:hidden; }
    body { color:var(--ink); font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; background:#f1f5f9; }
    button, input, summary { font:inherit; }
    .center-shell { display:flex; flex-direction:column; height:100dvh; min-height:0; overflow:hidden; }
    .center-header { position:relative; z-index:100; flex:0 0 auto; width:100%; color:#fff; background:linear-gradient(112deg,var(--header) 0%,var(--header-2) 55%,var(--header-3) 100%); box-shadow:0 5px 18px rgba(19,38,73,.18); }
    .brand-row { display:flex; align-items:center; justify-content:space-between; gap:24px; width:min(1500px,calc(100% - 48px)); min-height:100px; margin:0 auto; padding:0 24px; }
    .brand-copy { min-width:0; }
    .kicker, .sub { display:none; }
    h1 { margin:0; font-size:clamp(30px,2.5vw,38px); line-height:1; letter-spacing:.01em; white-space:nowrap; }
    .brand-suffix { color:rgba(255,255,255,.66); font-size:.72em; font-weight:650; letter-spacing:.08em; }
    .top-controls { display:flex; align-items:center; justify-content:flex-end; gap:8px; min-width:0; }
    .auth-strip { display:flex; align-items:center; gap:6px; }
    .top-controls input { width:156px; height:34px; padding:0 10px; border:1px solid rgba(255,255,255,.24); border-radius:8px; color:#fff; background:rgba(255,255,255,.10); outline:none; }
    .top-controls input:focus { border-color:rgba(255,255,255,.64); background:rgba(255,255,255,.16); }
    .top-controls input::placeholder { color:rgba(255,255,255,.62); }
    .top-controls button, .utility-menu summary { min-height:34px; padding:7px 11px; border:1px solid rgba(255,255,255,.15); border-radius:8px; color:#fff; background:rgba(255,255,255,.09); font-size:12px; font-weight:750; cursor:pointer; white-space:nowrap; }
    .top-controls button:hover, .utility-menu summary:hover { background:rgba(255,255,255,.18); }
    .top-controls button[data-center-action="login"] { background:#3f78ed; }
    .top-controls button[data-center-action="save"] { background:#169b73; }
    .top-controls button[data-center-action="load"] { background:#7758ca; }
    .sync-note { display:inline-flex; align-items:center; min-height:30px; padding:5px 9px; border:1px solid rgba(255,255,255,.18); border-radius:999px; color:rgba(255,255,255,.82); background:rgba(10,29,50,.18); font-size:11px; white-space:nowrap; }
    .sync-note[data-state="logged-in"] { color:#c6ffea; border-color:rgba(80,224,171,.35); background:rgba(15,98,74,.35); }
    .utility-menu { position:relative; }
    .utility-menu summary { display:flex; align-items:center; list-style:none; }
    .utility-menu summary::-webkit-details-marker { display:none; }
    .utility-strip { position:absolute; top:42px; right:0; z-index:20; display:grid; gap:7px; min-width:170px; padding:10px; border:1px solid rgba(255,255,255,.16); border-radius:12px; background:#172a4d; box-shadow:0 14px 34px rgba(5,18,38,.28); }
    .utility-strip button { width:100%; text-align:left; }
    .tool-state { padding:5px 3px 0; color:rgba(255,255,255,.62); font-size:11px; white-space:nowrap; }
    .center-nav { display:grid; grid-template-rows:auto auto; width:100%; padding:4px max(20px,calc((100vw - 1500px)/2)); border-top:1px solid rgba(255,255,255,.12); background:linear-gradient(180deg,rgba(8,27,59,.22),rgba(8,27,59,.12)); }
    .nav-row { display:flex; align-items:center; gap:4px; min-width:0; min-height:46px; padding:4px 0; overflow-x:auto; scrollbar-width:thin; }
    .nav-group { display:inline-flex; align-items:center; justify-content:center; gap:7px; flex:0 0 112px; min-height:34px; margin-right:8px; padding:6px 12px; border:1px solid rgba(255,255,255,.20); border-radius:10px; color:#fff; font-size:12px; font-weight:850; letter-spacing:.04em; white-space:nowrap; box-shadow:0 5px 14px rgba(5,18,38,.16); }
    .nav-group::before { content:""; width:7px; height:7px; flex:0 0 7px; border-radius:50%; background:rgba(255,255,255,.88); box-shadow:0 0 0 3px rgba(255,255,255,.16); }
    .nav-row-accounting .nav-group { background:linear-gradient(135deg,#f0a34a,#e87961); }
    .nav-row-assets .nav-group { background:linear-gradient(135deg,#20b486,#1f9da5); }
    .center-nav button { flex:0 0 auto; min-height:36px; padding:0 13px; border:1px solid rgba(255,255,255,.08); border-radius:10px; color:rgba(255,255,255,.76); background:rgba(255,255,255,.035); font-weight:700; cursor:pointer; white-space:nowrap; transition:color .18s ease,background .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease; }
    .center-nav button:hover { color:#fff; border-color:rgba(255,255,255,.20); background:rgba(255,255,255,.11); transform:translateY(-1px); }
    .center-nav button.active { color:#17284b; border-color:rgba(255,255,255,.72); background:#fff; box-shadow:0 6px 16px rgba(5,18,38,.20); }
    .nav-row-accounting button.active { box-shadow:inset 0 -3px 0 #e87961,0 6px 16px rgba(5,18,38,.20); }
    .nav-row-assets button.active { box-shadow:inset 0 -3px 0 #20b486,0 6px 16px rgba(5,18,38,.20); }
    .workspace { flex:1 1 auto; min-height:0; overflow:hidden; }
    .workspace, .frame-wrap { width:100%; margin:0; }
    .frame-wrap { height:100%; min-height:0; background:#f1f5f9; }
    iframe { display:block; width:100%; height:100%; min-height:0; border:0; background:#f1f5f9; }
    .mobile-page-nav { display:none; }
    .shortcut { display:none; }
    @media (max-width:980px) {
      .brand-row { width:100%; min-height:84px; padding:10px 16px; gap:10px; }
      h1 { font-size:22px; }
      .top-controls { max-width:70vw; overflow-x:auto; }
      .top-controls input { width:132px; min-width:132px; }
      .top-controls button[data-center-action="save"], .top-controls button[data-center-action="load"], .top-controls button[data-center-action="logout"] { display:none; }
      .center-nav { padding-inline:10px; }
      .nav-group { flex-basis:104px; }
      .frame-wrap, iframe { height:100%; min-height:0; }
    }
    @media (max-width:560px) {
      .brand-row { min-height:70px; padding:8px 12px; }
      h1 { font-size:19px; }
      .brand-suffix { display:none; }
      .top-controls input { display:none; }
      .sync-note { padding-inline:7px; }
      .center-nav { display:none; }
      .frame-wrap, iframe { height:100%; }
      .mobile-page-nav {
        position:fixed;
        right:8px;
        bottom:max(8px,env(safe-area-inset-bottom));
        left:8px;
        z-index:220;
        display:block;
        height:78px;
        padding:7px;
        border:1px solid rgba(255,255,255,.74);
        border-radius:22px;
        background:rgba(255,253,247,.94);
        box-shadow:0 16px 36px rgba(16,34,61,.26);
        backdrop-filter:blur(16px);
        overflow:hidden;
      }
      .mobile-page-track {
        display:flex;
        align-items:stretch;
        gap:4px;
        width:100%;
        height:100%;
        padding:0 2px;
        overflow-x:auto;
        overflow-y:hidden;
        overscroll-behavior-x:contain;
        scroll-snap-type:x mandatory;
        scrollbar-width:none;
        -webkit-overflow-scrolling:touch;
      }
      .mobile-page-track::-webkit-scrollbar { display:none; }
      .mobile-page-nav button {
        display:flex;
        flex:0 0 70px;
        scroll-snap-align:center;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:3px;
        height:62px;
        padding:5px 4px;
        border:0;
        border-radius:16px;
        color:#4b5870;
        background:transparent;
        font-size:11px;
        font-weight:800;
        line-height:1.1;
        white-space:nowrap;
      }
      .mobile-page-nav button::before {
        content:attr(data-mobile-icon);
        display:grid;
        place-items:center;
        min-height:25px;
        color:#26354f;
        font-size:22px;
        font-weight:500;
        line-height:1;
      }
      .mobile-page-nav button:hover { background:#eef3f4; }
      .mobile-page-nav button.active {
        color:#fff;
        background:linear-gradient(145deg,#17284b,#243962);
        box-shadow:0 8px 18px rgba(23,40,75,.26);
      }
      .mobile-page-nav button.active::before { color:#fff; }
      .mobile-page-nav button[data-center-page^="assets:"].active {
        background:linear-gradient(145deg,#167f79,#1f9da5);
      }
    }
  </style>
</head>
<body>
  <main class="center-shell">
    <header class="center-header">
      <div class="brand-row">
        <div class="brand-copy"><div><div class="kicker">Personal Finance Center</div><h1>個人財務中心 <span class="brand-suffix">┃ TSUBIN</span></h1><p class="sub">資產、記帳、帳戶、投資與報表集中在同一個入口。</p></div></div>
        <div class="top-controls">
          <div class="auth-strip">
            <input id="centerCloudEmail" type="email" placeholder="Email 登入同步" autocomplete="email">
            <button type="button" data-center-action="login">登入同步</button>
            <button type="button" data-center-action="save">儲存</button>
            <button type="button" data-center-action="load">載入</button>
            <button type="button" data-center-action="logout">登出</button>
            <span class="sync-note" id="syncNote">● 未登入</span>
          </div>
          <details class="utility-menu">
            <summary>工具</summary>
            <div class="utility-strip">
              <button type="button" data-center-action="updatePrices" data-assets-only>更新估值</button>
              <button type="button" data-center-action="privacy">隱私模式</button>
              <button type="button" data-center-action="theme">深色模式</button>
              <button type="button" data-center-action="dataManagement" data-assets-only>資料管理</button>
              <span class="tool-state" id="toolState">目前控制：記帳中心</span>
            </div>
          </details>
        </div>
      </div>
      <nav class="center-nav" aria-label="財務中心導覽">
        <div class="nav-row nav-row-accounting">
          <span class="nav-group">日常記帳</span>
          <button class="active" type="button" data-center-page="accounting:entryView">首頁</button>
          <button type="button" data-center-page="accounting:analyticsView">明細</button>
          <button type="button" data-center-page="accounting:accountView">帳戶</button>
          <button type="button" data-center-page="accounting:accountLedgerView">帳戶明細</button>
          <button type="button" data-center-page="accounting:transferView">轉帳</button>
          <button type="button" data-center-page="accounting:creditView">信用卡</button>
          <button type="button" data-center-page="accounting:creditReconcileView">對帳</button>
          <button type="button" data-center-page="accounting:recurringView">固定收支</button>
          <button type="button" data-center-page="accounting:categoryView">分類</button>
        </div>
        <div class="nav-row nav-row-assets">
          <span class="nav-group">個人資產</span>
          <button type="button" data-center-page="assets:overview">總覽</button>
          <button type="button" data-center-page="assets:cash">現金</button>
          <button type="button" data-center-page="assets:tw">台股</button>
          <button type="button" data-center-page="assets:us">美股</button>
          <button type="button" data-center-page="assets:metal">貴金屬</button>
          <button type="button" data-center-page="assets:fund">基金</button>
          <button type="button" data-center-page="assets:dca">定期投入</button>
          <button type="button" data-center-page="assets:purchase">交易</button>
          <button type="button" data-center-page="assets:dividend">股息</button>
          <button type="button" data-center-page="assets:bookkeeping">記帳總覽</button>
          <button type="button" data-center-page="assets:annual">年度報表</button>
          <button type="button" data-center-page="assets:chart">圖表</button>
        </div>
      </nav>
    </header>
    <section class="workspace" aria-label="財務中心內容">
      <div class="frame-wrap" id="mainFrameWrap"><iframe id="mainFrame" title="個人財務中心內容" src="accounting-app.html?embedded=1&amp;v=83#quick-entry"></iframe></div>
      <p class="shortcut">記帳與個人資產使用同一個財務中心、同一個瀏覽器資料來源與雲端同步資料。</p>
    </section>
  </main>
  <nav class="mobile-page-nav" aria-label="手機分頁選單">
    <div class="mobile-page-track">
      <button class="active" type="button" data-mobile-icon="⌂" data-center-page="accounting:entryView">首頁</button>
      <button type="button" data-mobile-icon="☷" data-center-page="accounting:analyticsView">明細</button>
      <button type="button" data-mobile-icon="▣" data-center-page="accounting:accountView">帳戶</button>
      <button type="button" data-mobile-icon="≡" data-center-page="accounting:accountLedgerView">帳戶明細</button>
      <button type="button" data-mobile-icon="⇄" data-center-page="accounting:transferView">轉帳</button>
      <button type="button" data-mobile-icon="▤" data-center-page="accounting:creditView">信用卡</button>
      <button type="button" data-mobile-icon="✓" data-center-page="accounting:creditReconcileView">對帳</button>
      <button type="button" data-mobile-icon="↻" data-center-page="accounting:recurringView">固定收支</button>
      <button type="button" data-mobile-icon="◆" data-center-page="accounting:categoryView">分類</button>
      <button type="button" data-mobile-icon="▦" data-center-page="assets:overview">總覽</button>
      <button type="button" data-mobile-icon="$" data-center-page="assets:cash">現金</button>
      <button type="button" data-mobile-icon="↗" data-center-page="assets:tw">台股</button>
      <button type="button" data-mobile-icon="⌁" data-center-page="assets:us">美股</button>
      <button type="button" data-mobile-icon="◇" data-center-page="assets:metal">貴金屬</button>
      <button type="button" data-mobile-icon="◔" data-center-page="assets:fund">基金</button>
      <button type="button" data-mobile-icon="↻" data-center-page="assets:dca">定期投入</button>
      <button type="button" data-mobile-icon="⇄" data-center-page="assets:purchase">交易</button>
      <button type="button" data-mobile-icon="$" data-center-page="assets:dividend">股息</button>
      <button type="button" data-mobile-icon="▤" data-center-page="assets:bookkeeping">記帳總覽</button>
      <button type="button" data-mobile-icon="▦" data-center-page="assets:annual">年度報表</button>
      <button type="button" data-mobile-icon="▥" data-center-page="assets:chart">圖表</button>
    </div>
  </nav>
  <script>
    const mainFrame = document.getElementById("mainFrame");
    const emailInput = document.getElementById("centerCloudEmail");
    const toolState = document.getElementById("toolState");
    let activePage = "accounting:entryView";
    function sendToActive(message) { mainFrame.contentWindow?.postMessage(message, "*"); }
    function resetWorkspacePosition() {
      window.scrollTo({ top: 0, left: 0, behavior: "auto" });
      try { mainFrame.contentWindow?.scrollTo({ top: 0, left: 0, behavior: "auto" }); } catch {}
    }
    function setEmbeddedShell() { sendToActive({ type: "finance-center-shell", compact: true }); }
    function setActiveButton(page) {
      document.querySelectorAll("[data-center-page]").forEach(item => item.classList.toggle("active", item.dataset.centerPage === page));
      if (window.matchMedia("(max-width:560px)").matches) {
        const track = document.querySelector(".mobile-page-track");
        const activeMobileItem = track?.querySelector(`[data-center-page="${page}"]`);
        if (track && activeMobileItem) requestAnimationFrame(() => track.scrollTo({ left: activeMobileItem.offsetLeft - (track.clientWidth - activeMobileItem.clientWidth) / 2, behavior: "smooth" }));
      }
    }
    function selectPage(page, { replace = false } = {}) {
      const [module, view] = page.split(":");
      activePage = page;
      setActiveButton(page);
      document.querySelectorAll("[data-assets-only]").forEach(item => item.hidden = module !== "assets");
      toolState.textContent = module === "assets" ? "目前控制：個人資產" : "目前控制：記帳中心";
      const target = module === "assets" ? `personal-assets-dashboard.html?embedded=1&v=83#${view}` : `accounting-app.html?embedded=1&v=83#${view === "entryView" ? "quick-entry" : view === "analyticsView" ? "analytics" : ""}`;
      if (mainFrame.dataset.module !== module) { mainFrame.dataset.module = module; mainFrame.src = target; }
      else sendToActive({ type: "finance-center-action", action: module === "assets" ? "tab" : "view", value: view });
      setTimeout(resetWorkspacePosition, 0);
      if (replace) history.replaceState(null, "", `#${page.replace(":", "-")}`);
    }
    mainFrame.addEventListener("load", () => {
      setEmbeddedShell();
      const [module, view] = activePage.split(":");
      setTimeout(() => {
        sendToActive({ type: "finance-center-action", action: module === "assets" ? "tab" : "view", value: view });
        resetWorkspacePosition();
      }, 60);
    });
    window.addEventListener("message", event => {
      if (event.data?.type !== "finance-center-status") return;
      const loggedIn = Boolean(event.data.loggedIn);
      const syncNote = document.getElementById("syncNote");
      syncNote.textContent = loggedIn ? "● 已登入" : "● 未登入";
      syncNote.dataset.state = loggedIn ? "logged-in" : "logged-out";
    });
    document.querySelectorAll("[data-center-action]").forEach(button => button.addEventListener("click", () => {
      const action = button.dataset.centerAction;
      if (action === "login") sendToActive({ type: "finance-center-action", action, email: emailInput.value.trim() });
      else sendToActive({ type: "finance-center-action", action });
      document.querySelector(".utility-menu")?.removeAttribute("open");
      toolState.textContent = action === "updatePrices" ? "正在更新市場資料…" : "工具已送出：" + button.textContent;
      setTimeout(() => { toolState.textContent = activePage.startsWith("assets:") ? "目前控制：個人資產" : "目前控制：記帳中心"; }, 1800);
    }));
    document.querySelectorAll("[data-center-page]").forEach(button => button.addEventListener("click", () => selectPage(button.dataset.centerPage, { replace: true })));
    const initialHash = location.hash.replace(/^#/, "");
    const initialPage = initialHash === "ledger" ? "accounting:entryView" : initialHash.startsWith("assets-") ? `assets:${initialHash.slice(7)}` : initialHash.startsWith("accounting-") ? `accounting:${initialHash.slice(10)}` : activePage;
    selectPage(initialPage, { replace: false });
    window.addEventListener("storage", event => {
      if (!["personal-assets-dashboard-tsubin-v2", "personal-accounting-tsubin-v1"].includes(event.key)) return;
      sendToActive({ type: "finance-center-refresh", key: event.key });
    });
  </script>
</body>
</html>
