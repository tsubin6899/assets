<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>個人財務中心｜TSUBIN</title>
  <meta name="description" content="整合日常記帳、帳戶負債、投資資產、現金流與財務分析的個人財務中心。">
  <meta name="theme-color" content="#17284b">
  <meta name="application-name" content="個人財務中心">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <style>
    :root {
      color-scheme:light;
      --ink:#17223a; --muted:#6a778c; --line:#dce5ed; --surface:#fff; --canvas:#eef4f7;
      --navy:#17284b; --blue:#3979ed; --teal:#169b91; --green:#1eaa7d; --amber:#e5a13d; --coral:#e57361;
      --purple:#8066ce; --danger:#d65d57; --shadow:0 14px 36px rgba(25,50,80,.10);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--canvas)}
    body{min-height:100%;margin:0;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:radial-gradient(circle at 92% 4%,rgba(62,199,176,.16),transparent 25rem),linear-gradient(135deg,#edf4fb,#f5f7f4 55%,#edf9f5)}
    body.privacy .money-value{filter:blur(9px);user-select:none}
    button,input,select,textarea{font:inherit}
    button,a{touch-action:manipulation}
    a{color:inherit;text-decoration:none}
    h1,h2,h3,p{margin:0}
    button{cursor:pointer}
    .app-header{position:sticky;top:0;z-index:100;color:#fff;background:linear-gradient(112deg,#142546,#285dca 55%,#138d8a);box-shadow:0 8px 26px rgba(17,38,72,.18)}
    .brand-row{display:flex;align-items:center;justify-content:space-between;gap:24px;width:min(1500px,calc(100% - 40px));min-height:100px;margin:auto}
    .brand{display:flex;align-items:center;gap:14px;min-width:0}
    .brand-mark{display:grid;place-items:center;width:46px;height:46px;flex:0 0 46px;border:1px solid rgba(255,255,255,.22);border-radius:15px;background:rgba(255,255,255,.12);box-shadow:inset 0 1px rgba(255,255,255,.15)}
    .brand-mark svg{width:25px;height:25px}
    .brand h1{font-size:clamp(28px,2.35vw,37px);line-height:1;white-space:nowrap}
    .brand h1 span{color:rgba(255,255,255,.62);font-size:.66em;letter-spacing:.08em}
    .brand p{margin-top:8px;color:rgba(255,255,255,.66);font-size:12px}
    .header-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;min-width:0}
    .cloud-email{width:170px;height:38px;padding:0 12px;border:1px solid rgba(255,255,255,.24);border-radius:10px;color:#fff;background:rgba(255,255,255,.10);outline:none}
    .cloud-email::placeholder{color:rgba(255,255,255,.62)}
    .header-btn,.status-pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:7px 11px;border:1px solid rgba(255,255,255,.16);border-radius:10px;color:#fff;background:rgba(255,255,255,.10);font-size:12px;font-weight:800;white-space:nowrap}
    .header-btn:hover{background:rgba(255,255,255,.19)}
    .header-btn.login{background:#3d79ed}.header-btn.save{background:#159a71}.header-btn.load{background:#7659c9}
    .status-pill{border-radius:999px;color:rgba(255,255,255,.86);background:rgba(11,27,52,.24)}
    .status-pill[data-state="online"]{color:#fff;border-color:#7df0c2;background:#0b9f6f;box-shadow:0 0 0 3px rgba(85,232,177,.18),0 7px 18px rgba(5,86,60,.28)}
    .status-pill[data-state="checking"]{color:#fff4c8;border-color:rgba(255,220,105,.48);background:rgba(145,102,10,.55)}
    .status-pill[data-state="error"]{color:#ffe1de;background:rgba(155,43,43,.42)}
    .primary-nav{display:flex;align-items:center;gap:6px;width:100%;padding:7px max(20px,calc((100vw - 1500px)/2));border-top:1px solid rgba(255,255,255,.12);background:rgba(8,27,59,.18);overflow-x:auto;scrollbar-width:none}
    .primary-nav::-webkit-scrollbar,.secondary-track::-webkit-scrollbar{display:none}
    .primary-nav button{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:0 0 auto;min-width:132px;min-height:43px;padding:0 17px;border:1px solid rgba(255,255,255,.10);border-radius:12px;color:rgba(255,255,255,.76);background:rgba(255,255,255,.035);font-weight:850;white-space:nowrap}
    .primary-nav button:hover{color:#fff;background:rgba(255,255,255,.11)}
    .primary-nav button.active{color:#17284b;border-color:#fff;background:#fff;box-shadow:0 8px 20px rgba(8,24,52,.22)}
    .primary-nav svg{width:18px;height:18px}
    .secondary-nav{position:sticky;top:157px;z-index:80;border-bottom:1px solid rgba(210,222,232,.9);background:rgba(248,251,252,.90);backdrop-filter:blur(14px)}
    .secondary-track{display:flex;align-items:center;gap:7px;width:min(1500px,calc(100% - 40px));min-height:54px;margin:auto;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
    .secondary-track button,.secondary-track a{flex:0 0 auto;scroll-snap-align:center;min-height:34px;padding:7px 13px;border:1px solid transparent;border-radius:10px;color:#59687d;background:transparent;font-size:13px;font-weight:750;white-space:nowrap}
    .secondary-track button:hover,.secondary-track button.active{color:#285dca;border-color:#cfe0f7;background:#eaf2ff}
    .secondary-track a{margin-left:auto;color:#53627b;border-color:#d8e1ea;background:#fff}
    .page{width:min(1500px,calc(100% - 40px));margin:0 auto;padding:24px 0 112px}
    .page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
    .page-heading h2{font-size:27px;letter-spacing:-.02em}
    .page-heading p{margin-top:7px;color:var(--muted);font-size:13px}
    .eyebrow{display:block;margin-bottom:5px;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    .grid{display:grid;gap:16px}.grid>*{min-width:0}
    .page[data-domain="investments"]>*{width:100%;max-width:100%}.page[data-domain="investments"] .inline-item>*{min-width:0}
    .home-grid{grid-template-columns:minmax(0,1.65fr) minmax(320px,.85fr)}
    .two-col{grid-template-columns:repeat(2,minmax(0,1fr))}
    .three-col{grid-template-columns:repeat(3,minmax(0,1fr))}
    .four-col{grid-template-columns:repeat(4,minmax(0,1fr))}
    .panel,.metric-card,.alert-card,.account-card{border:1px solid rgba(213,225,234,.92);border-radius:var(--radius);background:rgba(255,255,255,.92);box-shadow:var(--shadow)}
    .panel{padding:20px}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
    .panel-head h3{font-size:18px}
    .panel-head p{margin-top:4px;color:var(--muted);font-size:12px}
    .hero-card{position:relative;overflow:hidden;min-height:295px;padding:25px;border:0;border-radius:22px;color:#fff;background:linear-gradient(128deg,#18344a,#174152 55%,#155965);box-shadow:0 20px 46px rgba(20,58,72,.20)}
    .hero-card::after{content:"";position:absolute;right:-55px;top:-85px;width:245px;height:245px;border-radius:50%;background:rgba(111,213,188,.12)}
    .hero-top{position:relative;z-index:1;display:flex;justify-content:space-between;gap:20px}
    .hero-label{color:#b7d7d2;font-size:12px;font-weight:800}
    .net-worth{margin-top:9px;font-size:clamp(38px,4vw,58px);line-height:1;font-weight:500;letter-spacing:-.03em}
    .delta{display:inline-flex;align-items:center;gap:5px;margin-top:11px;color:#8de3c7;font-size:13px;font-weight:850}
    .hero-actions{position:relative;z-index:1;display:flex;gap:9px;margin-top:22px}
    .action-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:9px 14px;border:1px solid #dce5ed;border-radius:11px;color:#24324a;background:#fff;font-weight:800}
    .action-btn.secondary{color:#fff;border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.08)}
    .action-btn.blue{color:#fff;border-color:#3979ed;background:#3979ed}.action-btn.green{color:#fff;border-color:#1eaa7d;background:#1eaa7d}.action-btn.danger{color:#fff;border-color:#d65d57;background:#d65d57}
    .hero-metrics{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:20px}
    .hero-metrics div{padding:10px 12px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(255,255,255,.06)}
    .hero-metrics span{display:block;color:#a9c5c7;font-size:10px}.hero-metrics strong{display:block;margin-top:4px;font-size:14px}
    .metric-card{position:relative;overflow:hidden;padding:17px 18px;border-top:4px solid var(--tone,var(--blue))}
    .metric-card span{color:var(--muted);font-size:12px}.metric-card strong{display:block;margin-top:7px;font-size:26px;line-height:1.1}.metric-card small{display:block;margin-top:6px;color:#8590a0;font-size:11px}
    .tone-green{--tone:var(--green)}.tone-coral{--tone:var(--coral)}.tone-purple{--tone:var(--purple)}.tone-amber{--tone:var(--amber)}.tone-teal{--tone:var(--teal)}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .form-grid .wide{grid-column:1/-1}
    label{display:grid;gap:6px;color:#59667a;font-size:12px;font-weight:750}
    input,select,textarea{width:100%;min-height:42px;padding:9px 11px;border:1px solid #d5dfe8;border-radius:10px;color:var(--ink);background:#fff;outline:none}
    textarea{min-height:76px;resize:vertical}
    input:focus,select:focus,textarea:focus{border-color:#6c9bf2;box-shadow:0 0 0 3px rgba(57,121,237,.12)}
    .segmented{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:13px;padding:4px;border:1px solid #dbe4e8;border-radius:11px;background:#eef4f1}
    .segmented label{display:block}
    .segmented input{position:absolute;opacity:0;pointer-events:none}
    .segmented span{display:block;padding:9px;border-radius:8px;text-align:center;color:#627083;font-weight:850;cursor:pointer}
    .segmented input:checked+span{color:#fff;background:var(--coral);box-shadow:0 6px 14px rgba(229,115,97,.2)}
    .segmented label:last-child input:checked+span{background:var(--green)}
    .alert-list{display:grid;gap:9px}
    .alert-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;padding:12px 13px;border-radius:13px;box-shadow:none}
    .alert-dot{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(57,121,237,.12)}
    .alert-card.warning .alert-dot{background:var(--amber);box-shadow:0 0 0 4px rgba(229,161,61,.14)}
    .alert-card.danger .alert-dot{background:var(--danger);box-shadow:0 0 0 4px rgba(214,93,87,.14)}
    .alert-card strong{display:block;font-size:13px}.alert-card small{display:block;margin-top:3px;color:var(--muted);font-size:11px}
    .status-chip{padding:4px 7px;border-radius:999px;color:#52647a;background:#eef3f6;font-size:10px;font-weight:800}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
    .row-actions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}.row-actions .action-btn{min-height:34px;padding:6px 10px;font-size:12px}
    .filter-bar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}.filter-bar .action-btn{align-self:end}
    .inline-list{display:grid;gap:10px}.inline-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff}.inline-item small{display:block;margin-top:4px;color:var(--muted)}
    .recurring-item{position:relative;overflow:hidden;border-left:5px solid var(--coral)}.recurring-item>div:first-child{display:grid;justify-items:start}.recurring-item.expense{background:linear-gradient(90deg,rgba(229,115,97,.09),#fff 28%)}.recurring-item.income{border-left-color:var(--green);background:linear-gradient(90deg,rgba(30,170,125,.10),#fff 28%)}.recurring-kind{display:inline-flex;margin-bottom:5px;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:900}.recurring-item.expense .recurring-kind{color:#a84339;background:#ffe7e3}.recurring-item.income .recurring-kind{color:#087451;background:#dff8ee}.recurring-item.expense .recurring-amount{color:var(--danger)}.recurring-item.income .recurring-amount{color:var(--green)}
    table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
    th,td{padding:11px 12px;border-bottom:1px solid #e7edf2;text-align:left;white-space:nowrap}
    th{color:#5c6c7e;background:#f4f7f8;font-size:11px}tr:last-child td{border-bottom:0}
    .positive{color:#168c68}.negative{color:#d45e55}.muted{color:var(--muted)}
    .account-card{position:relative;overflow:hidden;padding:17px;border-top:4px solid var(--teal);background:linear-gradient(145deg,#fff,#f7fbfb)}
    .account-card::after{content:"";position:absolute;right:-28px;bottom:-38px;width:100px;height:100px;border-radius:50%;background:var(--account-glow,rgba(30,170,125,.08));pointer-events:none}.account-card.cash{border-top-color:#1eaa7d;--account-glow:rgba(30,170,125,.12)}.account-card.bank{border-top-color:#3979ed;--account-glow:rgba(57,121,237,.12)}.account-card.foreign{border-top-color:#7b61d1;--account-glow:rgba(123,97,209,.12)}.account-card.payment{border-top-color:#149d9a;--account-glow:rgba(20,157,154,.12)}.account-card.other{border-top-color:#e5a13d;--account-glow:rgba(229,161,61,.12)}
    .account-card.credit{border-top-color:var(--danger);--account-glow:rgba(214,93,87,.14);background:linear-gradient(145deg,#fff,#fff6f5)}
    .account-card .account-title{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .account-identity{display:flex;align-items:center;gap:10px}.account-icon{display:grid;place-items:center;width:38px;height:38px;flex:0 0 38px;border-radius:12px;color:#fff;background:var(--account-color,var(--teal))}.account-icon svg{width:19px;height:19px}.account-card.cash{--account-color:#1eaa7d}.account-card.bank{--account-color:#3979ed}.account-card.foreign{--account-color:#7b61d1}.account-card.payment{--account-color:#149d9a}.account-card.other{--account-color:#d9962e}.account-card.credit{--account-color:#d65d57}
    .account-card h3{font-size:15px}.account-card p{margin-top:4px;color:var(--muted);font-size:11px}.account-card .status-chip{position:relative;z-index:1}.account-card.credit .status-chip{color:#a53f38;background:#ffe5e1}
    .account-card .balance{display:block;margin-top:15px;font-size:25px;font-weight:750}
    .account-card.credit .balance{color:var(--danger)!important}
    .calendar-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.75fr);gap:16px}.calendar-toolbar{display:flex;align-items:center;gap:8px}.calendar-toolbar strong{min-width:116px;text-align:center;font-size:17px}.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.calendar-weekdays{margin-bottom:7px;color:var(--muted);font-size:11px;font-weight:850;text-align:center}.calendar-day{position:relative;min-height:105px;padding:9px;border:1px solid #dce5eb;border-radius:12px;text-align:left;color:var(--ink);background:#fff;transition:.16s}.calendar-day:hover{transform:translateY(-1px);border-color:#87aae9;box-shadow:0 8px 20px rgba(36,77,132,.10)}.calendar-day.blank{visibility:hidden}.calendar-day.selected{color:#fff;border-color:#285dca;background:linear-gradient(145deg,#285dca,#244995);box-shadow:0 10px 22px rgba(40,93,202,.25)}.calendar-day.today:not(.selected){border-color:#3979ed;box-shadow:inset 0 0 0 2px rgba(57,121,237,.14)}.calendar-date{display:block;font-size:13px;font-weight:900}.calendar-day-lines{display:grid;gap:3px;margin-top:11px;font-size:10px}.calendar-income{color:var(--green)}.calendar-expense{color:var(--danger)}.calendar-day.selected .calendar-income,.calendar-day.selected .calendar-expense{color:#fff}.calendar-count{position:absolute;right:7px;top:7px;min-width:20px;padding:2px 5px;border-radius:999px;color:#52647a;background:#edf2f5;font-size:9px;text-align:center}.calendar-day.selected .calendar-count{color:#244995;background:#fff}.calendar-selected-total{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}.calendar-selected-total div{padding:10px;border-radius:11px;background:#f4f7f8}.calendar-selected-total span{display:block;color:var(--muted);font-size:10px}.calendar-selected-total strong{display:block;margin-top:4px;font-size:16px}.trade-detail-card{align-items:flex-start}.trade-detail-main{min-width:0}.trade-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px}.trade-tag{padding:3px 7px;border-radius:999px;font-size:10px;font-weight:900}.trade-tag.buy{color:#225bb9;background:#e4efff}.trade-tag.sell{color:#8b4b05;background:#fff0d9}.trade-metrics{display:grid;grid-template-columns:repeat(3,minmax(92px,1fr));gap:7px;margin-top:9px}.trade-metrics div{padding:7px 9px;border-radius:9px;background:#f4f7f8}.trade-metrics span{display:block;color:var(--muted);font-size:9px}.trade-metrics strong{display:block;margin-top:3px;font-size:12px}.trade-result{min-width:170px;text-align:right}.trade-result .gain{color:var(--green)}.trade-result .loss{color:var(--danger)}
    .allocation-list,.bar-list{display:grid;gap:12px}
    .allocation-row{display:grid;grid-template-columns:74px 1fr 76px;align-items:center;gap:11px;font-size:12px}
    .bar{height:9px;overflow:hidden;border-radius:999px;background:#e9eff3}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--teal))}
    .holding-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .holding{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
    .holding strong{font-size:14px}.holding span{display:block;margin-top:8px;font-size:20px;font-weight:750}.holding small{display:block;margin-top:4px;color:var(--muted)}
    .trend{display:flex;align-items:flex-end;gap:7px;height:150px;padding-top:12px}
    .trend-bar{position:relative;flex:1;min-width:10px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#64b8a6,#3979ed);opacity:.85}
    .trend-bar:hover{opacity:1}.trend-bar span{position:absolute;right:50%;bottom:-22px;transform:translateX(50%);color:#7b8797;font-size:9px;white-space:nowrap}
    .empty{padding:25px;border:1px dashed #ccd8e1;border-radius:14px;color:var(--muted);text-align:center;background:rgba(255,255,255,.55)}
    .backup-list{display:grid;gap:8px}.backup-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}.backup-row strong{font-size:12px}.backup-row small{display:block;margin-top:3px;color:var(--muted);font-size:10px}
    .toast{position:fixed;right:18px;bottom:18px;z-index:300;max-width:min(390px,calc(100vw - 36px));padding:12px 16px;border-radius:12px;color:#fff;background:#17284b;box-shadow:0 15px 32px rgba(15,32,61,.25);font-size:13px;opacity:0;transform:translateY(16px);pointer-events:none;transition:.2s}
    .toast.show{opacity:1;transform:none}
    .auth-dialog{width:min(430px,calc(100vw - 28px));padding:0;border:0;border-radius:20px;color:var(--ink);background:#fff;box-shadow:0 28px 80px rgba(12,27,52,.34)}.auth-dialog::backdrop{background:rgba(10,24,48,.58);backdrop-filter:blur(4px)}.auth-dialog-body{display:grid;gap:14px;padding:22px}.auth-dialog h3{font-size:21px}.auth-dialog p{color:var(--muted);font-size:13px;line-height:1.6}.auth-dialog input{width:100%;height:46px;padding:0 13px;border:1px solid var(--line);border-radius:11px;color:var(--ink);background:#fff}.auth-dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .mobile-nav{display:none}
    .desktop-only{display:inline-flex}
    @media(max-width:1100px){.brand p{display:none}.cloud-email{display:none}.home-grid{grid-template-columns:1fr}.holding-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.four-col{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:760px){
      .app-header{position:sticky}.brand-row{width:100%;min-height:70px;padding:8px 12px}.brand-mark{width:38px;height:38px;flex-basis:38px;border-radius:12px}.brand-mark svg{width:21px}.brand h1{font-size:19px}.brand h1 span{display:none}
      .header-actions .save,.header-actions .load,.header-actions .logout,.desktop-only{display:none}.header-btn{padding-inline:9px}.status-pill{font-size:10px;padding-inline:8px}
      .primary-nav{display:none}.secondary-nav{top:70px}.secondary-track{width:100%;min-height:50px;padding:0 10px}.secondary-track a{display:none}
      .page{width:100%;padding:17px 12px 104px}.page-heading{align-items:flex-start}.page-heading h2{font-size:23px}.page-heading .action-btn{display:none}
      .two-col,.three-col,.four-col{grid-template-columns:1fr}.home-grid{grid-template-columns:1fr}.panel{padding:15px}.hero-card{min-height:0;padding:20px 16px}.hero-top{display:block}.net-worth{font-size:42px}.hero-metrics{grid-template-columns:1fr}.metric-card strong{font-size:23px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.holding-grid{grid-template-columns:1fr 1fr}.allocation-row{grid-template-columns:58px 1fr 66px}.table-wrap{border:0}
      table,thead,tbody,tr,th,td{display:block}thead{display:none}tr{margin-bottom:9px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}td{display:flex;justify-content:space-between;gap:12px;padding:6px 4px;border:0;white-space:normal;text-align:right}td::before{content:attr(data-label);color:var(--muted);font-size:11px;text-align:left}
      .mobile-nav{position:fixed;right:8px;bottom:max(8px,env(safe-area-inset-bottom));left:8px;z-index:220;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;height:76px;padding:7px;border:1px solid rgba(255,255,255,.8);border-radius:22px;background:rgba(255,253,247,.95);box-shadow:0 16px 36px rgba(16,34,61,.26);backdrop-filter:blur(16px)}
      .mobile-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:15px;color:#526076;background:transparent;font-size:10px;font-weight:800}.mobile-nav svg{width:21px;height:21px}.mobile-nav button.active{color:#fff;background:linear-gradient(145deg,#17284b,#2b4778);box-shadow:0 8px 17px rgba(23,40,75,.25)}
      .toast{bottom:96px}
    }
    @media(max-width:900px){.calendar-layout{grid-template-columns:1fr}.calendar-day{min-height:92px}}
    @media(max-width:720px){.filter-bar{grid-template-columns:1fr 1fr}.inline-item{align-items:flex-start;flex-direction:column}.row-actions{justify-content:flex-start}.calendar-weekdays,.calendar-grid{gap:4px}.calendar-day{min-height:76px;padding:6px;border-radius:9px}.calendar-day-lines{margin-top:7px}.calendar-day-lines span{font-size:8px}.calendar-count{display:none}.trade-metrics{grid-template-columns:1fr 1fr}.trade-result{width:100%;text-align:left}}
    @media(max-width:390px){.brand{gap:8px}.brand-mark{display:none}.header-actions{gap:4px}.header-btn.login{font-size:11px}.holding-grid{grid-template-columns:1fr}.hero-actions{display:grid;grid-template-columns:1fr 1fr}.action-btn{padding-inline:8px}}

<body>
  <header class="app-header">
    <div class="brand-row">
      <div class="brand">
        <span class="brand-mark"><i data-lucide="landmark"></i></span>
        <div><h1>個人財務中心 <span>┃ TSUBIN</span></h1><p>記帳、帳戶、投資、負債與分析，共用同一份財務資料。</p></div>
      </div>
      <div class="header-actions">
        <input class="cloud-email" id="cloudEmail" type="email" placeholder="Email 登入同步" autocomplete="email">
        <button class="header-btn login" id="cloudLogin" type="button">登入同步</button>
        <button class="header-btn save" id="cloudSave" type="button" hidden>儲存</button>
        <button class="header-btn load" id="cloudLoad" type="button" hidden>載入</button>
        <button class="header-btn logout" id="cloudLogout" type="button" hidden>登出</button>
        <span class="status-pill" id="cloudStatus" data-state="offline" role="status" aria-live="polite" tabindex="0" title="點擊重新檢查登入狀態">● 未登入</span>
        <button class="header-btn" id="privacyToggle" type="button" title="隱藏金額"><i data-lucide="eye-off"></i><span class="desktop-only">隱私</span></button>
      </div>
    </div>
    <nav class="primary-nav" aria-label="主要功能">
      <button type="button" data-domain="home"><i data-lucide="home"></i>首頁</button>
      <button type="button" data-domain="daily"><i data-lucide="notebook-tabs"></i>日常記帳</button>
      <button type="button" data-domain="accounts"><i data-lucide="wallet-cards"></i>帳戶與負債</button>
      <button type="button" data-domain="investments"><i data-lucide="chart-candlestick"></i>投資資產</button>
      <button type="button" data-domain="analysis"><i data-lucide="chart-no-axes-combined"></i>分析與報表</button>
    </nav>
  </header>
  <nav class="secondary-nav" aria-label="目前領域分頁"><div class="secondary-track" id="secondaryNav"></div></nav>
  <main class="page" id="app" tabindex="-1"></main>
  <nav class="mobile-nav" aria-label="手機主要功能">
    <button type="button" data-domain="home"><i data-lucide="home"></i><span>首頁</span></button>
    <button type="button" data-domain="daily"><i data-lucide="notebook-tabs"></i><span>記帳</span></button>
    <button type="button" data-domain="accounts"><i data-lucide="wallet-cards"></i><span>帳戶</span></button>
    <button type="button" data-domain="investments"><i data-lucide="chart-candlestick"></i><span>資產</span></button>
    <button type="button" data-domain="analysis"><i data-lucide="chart-no-axes-combined"></i><span>分析</span></button>
  </nav>
  <input id="importFile" type="file" accept="application/json" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog class="auth-dialog" id="cloudLoginDialog"><form class="auth-dialog-body" id="cloudLoginForm" method="dialog"><div><h3>Email 登入同步</h3><p>輸入 Email 後，系統會寄送一次性登入連結。開啟信件中的連結即可完成登入。</p></div><label>Email<input id="cloudDialogEmail" name="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" required></label><div class="auth-dialog-actions"><button class="action-btn" id="cloudLoginCancel" type="button">取消</button><button class="action-btn blue" id="cloudLoginSend" type="submit">寄送登入連結</button></div></form></dialog>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="market-data-config.js"></script>
  <script src="finance-core.js?v=4"></script>
  <script>
    const app = document.getElementById("app");
    const secondaryNav = document.getElementById("secondaryNav");
    const routes = {
      home: { label: "首頁", tabs: [["overview","今日總覽"],["actions","行動中心"]] },
      daily: { label: "日常記帳", tabs: [["quick","快速記帳"],["calendar","月份行事曆"],["records","收支明細"],["budgets","分類預算"],["recurring","固定收支"],["closeout","月結"]] },
      accounts: { label: "帳戶與負債", tabs: [["accounts","帳戶總覽"],["transfer","帳戶轉帳"],["credit","信用卡帳單"],["installments","信用卡分期"],["reconcile","帳戶與卡片對帳"]] },
      investments: { label: "投資資產", tabs: [["portfolio","資產配置"],["holdings","持有部位"],["trades","交易紀錄"],["dividends","股息收入"]] },
      analysis: { label: "分析與報表", tabs: [["trends","資產趨勢"],["spending","支出分析"],["events","財務事件"],["data","資料管理"]] }
    };
    let state = { domain: "home", tab: "overview", privacy: false };
    const ui = { editingEntryId:"", editingAccountId:"", editingTransferId:"", editingBillId:"", editingBudgetId:"", editingRecurringId:"", editingInstallmentId:"", editingTradeId:"", editingDividendId:"", editingHoldingKey:"", calendarMonth:FinanceCore.monthOf(), selectedDate:FinanceCore.localDate(), filters:{ month:FinanceCore.monthOf(), type:"all", category:"all", account:"all", query:"" } };
    let current = FinanceCore.insights();
    let toastTimer = 0;
    let supabaseClient = null;
    let cloudUser = null;
    let cloudReady = false;
    let lastCloudSessionCheck = 0;
    let cloudSaveTimer = 0;
    let privacyTimer = 0;

    function esc(value) { return String(value ?? "").replace(/[&<>'"]/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;" })[char]); }
    function money(value, currency = "TWD") { return `${currency === "TWD" ? "NT$" : esc(currency)} ${Math.round(Number(value) || 0).toLocaleString("zh-TW")}`; }
    function unitPrice(value, currency = "TWD") { return `${currency === "TWD" ? "NT$" : esc(currency)} ${(Number(value)||0).toLocaleString("zh-TW",{minimumFractionDigits:2,maximumFractionDigits:4})}`; }
    function signed(value) { const n = Math.round(Number(value) || 0); return `${n >= 0 ? "+" : "−"}${Math.abs(n).toLocaleString("zh-TW")}`; }
    function pct(value) { return `${Math.round((Number(value) || 0) * 10) / 10}%`; }
    function dateTime(value) { try { return new Intl.DateTimeFormat("zh-TW", { dateStyle:"medium", timeStyle:"short" }).format(new Date(value)); } catch { return value || ""; } }
    function showToast(message) { const node = document.getElementById("toast"); node.textContent = message; node.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => node.classList.remove("show"), 2300); }
    function option(value, label, selected) { return `<option value="${esc(value)}" ${String(value) === String(selected) ? "selected" : ""}>${esc(label)}</option>`; }
    function accountOptions(selected = "", regularOnly = false) { return current.ledger.accounts.filter(row => !regularOnly || row.type !== "信用卡").map(row => option(row.name, `${row.name}｜${row.currency || "TWD"}`, selected)).join(""); }
    function refresh() { current = FinanceCore.insights(); render(); }
    function setRoute(domain, tab = "") {
      if (!routes[domain]) domain = "home";
      const allowed = routes[domain].tabs.map(row => row[0]);
      state.domain = domain; state.tab = allowed.includes(tab) ? tab : allowed[0];
      history.replaceState(null, "", `#${state.domain}/${state.tab}`);
      document.querySelectorAll("[data-domain]").forEach(node => node.classList.toggle("active", node.dataset.domain === domain));
      renderSecondary(); render(); window.scrollTo({ top: 0, behavior: "auto" });
    }
    function hasCloudAuthCallback() { const hash=location.hash.replace(/^#/,"");return location.search.includes("code=")||/(^|&)(access_token|refresh_token|error|error_description|type)=/.test(hash); }
    function readRoute() { if(hasCloudAuthCallback()){state.domain="home";state.tab="overview";renderSecondary();render();return}const [domain, tab] = location.hash.replace(/^#/, "").split("/"); setRoute(domain || "home", tab || ""); }
    function renderSecondary() {
      const route = routes[state.domain];
      secondaryNav.innerHTML = route.tabs.map(([id,label]) => `<button type="button" class="${id === state.tab ? "active" : ""}" data-tab="${id}">${label}</button>`).join("");
    }
    function pageHeading(kicker, title, note, action = "") { return `<header class="page-heading"><div><span class="eyebrow">${esc(kicker)}</span><h2>${esc(title)}</h2><p>${esc(note)}</p></div>${action}</header>`; }
    function metric(label, value, note, tone = "") { return `<article class="metric-card ${tone}"><span>${esc(label)}</span><strong class="money-value ${/負債/.test(label)?"negative":""}">${value}</strong><small>${esc(note)}</small></article>`; }
    function alertList(rows) {
      return rows.length ? `<div class="alert-list">${rows.map(row => `<article class="alert-card ${esc(row.level)}"><i class="alert-dot"></i><div><strong>${esc(row.title)}</strong><small>${esc(row.detail)}</small></div><span class="status-chip">${row.level === "danger" ? "需處理" : row.level === "warning" ? "留意" : "建議"}</span></article>`).join("")}</div>` : `<div class="empty">目前沒有需要處理的財務提醒。</div>`;
    }
    function quickEntryForm(compact = false, row = null) {
      const categories = uniqueCategories();
      return `<form id="quickEntryForm" class="${compact ? "" : "panel"}">
        <input type="hidden" name="id" value="${esc(row?.id || "")}">
        <div class="segmented"><label><input type="radio" name="type" value="expense" ${row?.type!=="income"?"checked":""}><span>支出</span></label><label><input type="radio" name="type" value="income" ${row?.type==="income"?"checked":""}><span>收入</span></label></div>
        <div class="form-grid">
          <label>金額<input name="amount" type="number" min="0" step="1" inputmode="decimal" required placeholder="0" value="${esc(row?.amount || "")}"></label>
          <label>日期<input name="date" type="date" value="${esc(row?.date || FinanceCore.localDate())}" required></label>
          <label>分類<select name="category">${categories.map(item => option(item,item,row?.category)).join("")}</select></label>
          <label>帳戶<select name="account">${accountOptions(row?.account || "")}</select></label>
          <label>項目<input name="item" placeholder="例如：午餐" value="${esc(row?.item || "")}"></label>
          <label>商家／來源<input name="merchant" placeholder="例如：早餐店" value="${esc(row?.merchant || "")}"></label>
          ${compact ? "" : `<label class="wide">備註<textarea name="note" placeholder="選填">${esc(row?.note || "")}</textarea></label>`}
        </div>
        <button class="action-btn blue" style="width:100%;margin-top:13px" type="submit"><i data-lucide="${row?"save":"plus"}"></i>${row?"儲存修改":"新增記帳"}</button>
        ${row ? `<button class="action-btn" style="width:100%;margin-top:8px" type="button" data-cancel-entry>取消編輯</button>` : ""}
      </form>`;
    }
    function uniqueCategories() { return [...new Set([...(current.ledger.categories?.expense || []), ...(current.ledger.categories?.income || []), "未分類"])]; }
    function snapshotBars() {
      const rows = [...(current.assets.assetSnapshots || [])].sort((a,b) => String(a.date).localeCompare(String(b.date))).slice(-12);
      if (!rows.length) return `<div class="empty">建立資產快照後，這裡會顯示最近 12 次淨資產變化。</div>`;
      const values = rows.map(row => Number(row.net ?? row.total) || 0); const min = Math.min(...values); const max = Math.max(...values); const span = Math.max(1,max-min);
      return `<div class="trend">${rows.map((row,index) => `<div class="trend-bar" style="height:${28 + (values[index]-min)/span*72}%" title="${esc(row.date)}｜${money(values[index])}"><span>${esc(String(row.date).slice(5))}</span></div>`).join("")}</div>`;
    }
    function renderHome() {
      const a = current.assetsSummary, m = current.month, avg = current.averageMonthlyExpense;
      const safety = avg > 0 ? a.cash / avg : null;
      const snapshots = [...(current.assets.assetSnapshots || [])].sort((x,y) => String(x.date).localeCompare(String(y.date)));
      const previousNet = Number(snapshots.at(-2)?.net ?? snapshots.at(-2)?.total ?? a.netWorth) || a.netWorth;
      const delta = a.netWorth - previousNet;
      const upcoming = [...(current.ledger.creditBills || []).filter(row => !row.paid), ...(current.ledger.recurringRules || []).map(row => ({ card:row.name,dueDate:`每${row.day || 1}日`,amount:row.amount }))].slice(0,5);
      const heading = pageHeading("Personal Finance Center", "今日財務決策中心", "先看可用資金、現金流、淨資產與需要處理的事項。", `<button class="action-btn" data-create-backup><i data-lucide="shield-check"></i>建立還原點</button>`);
      return `${heading}<div class="home-grid grid"><section class="grid">
        <article class="hero-card"><div class="hero-top"><div><span class="hero-label">目前淨資產</span><div class="net-worth money-value">${money(a.netWorth)}</div><div class="delta">${delta >= 0 ? "↑" : "↓"} ${signed(delta)}｜與前次快照比較</div></div></div>
          <div class="hero-actions"><button class="action-btn" data-go="daily/quick"><i data-lucide="plus"></i>快速記帳</button><button class="action-btn secondary" data-go="investments/trades"><i data-lucide="arrow-left-right"></i>記錄交易</button></div>
          <div class="hero-metrics"><div><span>現金安全</span><strong>${safety === null ? "待設定" : `${safety.toFixed(1)} 個月`}</strong></div><div><span>信用卡負債比</span><strong>${a.totalAssets ? pct(a.liabilities/a.totalAssets*100) : "0%"}</strong></div><div><span>待處理提醒</span><strong>${current.alerts.length} 筆</strong></div></div>
        </article>
        <div class="four-col grid">${metric("本月收入",money(m.income),`${m.rows.filter(r=>["income","dividend"].includes(r.kind)).length} 筆收入`,"tone-green")}${metric("本月支出",money(m.expense),`${m.rows.filter(r=>r.kind==="expense").length} 筆支出`,"tone-coral")}${metric("本月結餘",money(m.balance),"收入扣除一般支出",m.balance>=0?"tone-teal":"tone-coral")}${metric("帳戶可用資金",money(a.cash),"已納入轉帳與投資現金流","tone-purple")}</div>
        <section class="panel"><div class="panel-head"><div><h3>淨資產趨勢</h3><p>最近 12 次資產快照</p></div><button class="action-btn" data-go="analysis/trends">詳細分析</button></div>${snapshotBars()}</section>
        <section class="panel"><div class="panel-head"><div><h3>即將到期</h3><p>信用卡帳單與固定收支</p></div></div>${upcoming.length ? `<div class="alert-list">${upcoming.map(row => `<article class="alert-card warning"><i class="alert-dot"></i><div><strong>${esc(row.card || row.name)}</strong><small>${esc(row.dueDate || "待排程")}</small></div><span class="money-value">${money(row.amount)}</span></article>`).join("")}</div>` : `<div class="empty">目前沒有即將到期的款項。</div>`}</section>
      </section><aside class="grid"><section class="panel"><div class="panel-head"><div><h3>快速記帳</h3><p>新增後立即反映在帳戶與首頁</p></div></div>${quickEntryForm(true)}</section><section class="panel"><div class="panel-head"><div><h3>行動中心</h3><p>依資料自動整理</p></div></div>${alertList(current.alerts.slice(0,7))}</section></aside></div>`;
    }
    function eventRows(events) {
      return events.length ? `<div class="table-wrap"><table><thead><tr><th>日期</th><th>事件</th><th>分類</th><th>帳戶</th><th>金額</th></tr></thead><tbody>${events.map(row => `<tr><td data-label="日期">${esc(row.date)}</td><td data-label="事件">${esc(row.title)}</td><td data-label="分類">${esc(row.category)}</td><td data-label="帳戶">${esc(row.account || row.toAccount || "—")}</td><td data-label="金額" class="money-value ${row.direction>0?"positive":row.direction<0?"negative":"muted"}">${row.direction ? signed(row.twdAmount*row.direction) : money(row.twdAmount)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">目前沒有符合條件的財務事件。</div>`;
    }
    function filteredEntries() {
      const f=ui.filters, query=f.query.trim().toLowerCase();
      return [...current.ledger.entries].filter(row=>!f.month||String(row.date||"").startsWith(f.month)).filter(row=>f.type==="all"||row.type===f.type).filter(row=>f.category==="all"||row.category===f.category).filter(row=>f.account==="all"||row.account===f.account).filter(row=>!query||[row.category,row.item,row.merchant,row.note,row.account].some(value=>String(value||"").toLowerCase().includes(query))).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.id).localeCompare(String(a.id)));
    }
    function entryTable(rows) { return rows.length?`<div class="table-wrap"><table><thead><tr><th>日期</th><th>類型</th><th>項目</th><th>分類／帳戶</th><th>金額</th><th>操作</th></tr></thead><tbody>${rows.map(row=>`<tr><td data-label="日期">${esc(row.date)}</td><td data-label="類型"><span class="status-chip">${row.type==="income"?"收入":"支出"}</span></td><td data-label="項目"><strong>${esc(row.merchant||row.item||row.category)}</strong><small>${esc(row.note||"")}</small></td><td data-label="分類／帳戶">${esc(row.category)}<small>${esc(row.account||"—")}</small></td><td data-label="金額" class="money-value ${row.type==="income"?"positive":"negative"}">${signed((row.type==="income"?1:-1)*Number(row.amount||0))}</td><td data-label="操作"><div class="row-actions"><button class="action-btn" data-edit-entry="${esc(row.id)}">編輯</button><button class="action-btn danger" data-delete-entry="${esc(row.id)}">刪除</button></div></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">目前沒有符合條件的收支紀錄。</div>`; }
    function shiftMonthValue(month,offset) { const [year,monthNumber]=String(month||FinanceCore.monthOf()).split("-").map(Number),date=new Date(year,monthNumber-1+Number(offset||0),1);return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}`; }
    function renderDailyCalendar(head) {
      const month=ui.calendarMonth||FinanceCore.monthOf(),[year,monthNumber]=month.split("-").map(Number),firstDay=new Date(year,monthNumber-1,1).getDay(),daysInMonth=new Date(year,monthNumber,0).getDate(),today=FinanceCore.localDate();
      if(!String(ui.selectedDate||"").startsWith(month)) ui.selectedDate=`${month}-01`;
      const rows=(current.ledger.entries||[]).filter(row=>String(row.date||"").startsWith(month)&&!row.recurringSkipped).sort((a,b)=>String(b.id||"").localeCompare(String(a.id||"")));
      const byDate=new Map(); rows.forEach(row=>{const dayRows=byDate.get(row.date)||[];dayRows.push(row);byDate.set(row.date,dayRows)});
      const cells=[];for(let blank=0;blank<firstDay;blank+=1)cells.push(`<span class="calendar-day blank" aria-hidden="true"></span>`);
      for(let day=1;day<=daysInMonth;day+=1){const date=`${month}-${String(day).padStart(2,"0")}`,dayRows=byDate.get(date)||[],income=dayRows.filter(row=>row.type==="income").reduce((sum,row)=>sum+Number(row.amount||0),0),expense=dayRows.filter(row=>row.type!=="income").reduce((sum,row)=>sum+Number(row.amount||0),0);cells.push(`<button class="calendar-day ${date===ui.selectedDate?"selected":""} ${date===today?"today":""}" type="button" data-calendar-date="${date}" aria-label="${date}，${dayRows.length} 筆收支"><span class="calendar-date">${day}</span>${dayRows.length?`<span class="calendar-count">${dayRows.length}</span><span class="calendar-day-lines">${income?`<span class="calendar-income">收 ${money(income)}</span>`:""}${expense?`<span class="calendar-expense">支 ${money(expense)}</span>`:""}</span>`:""}</button>`)}
      const selectedRows=(byDate.get(ui.selectedDate)||[]).sort((a,b)=>String(b.id||"").localeCompare(String(a.id||""))),selectedIncome=selectedRows.filter(row=>row.type==="income").reduce((sum,row)=>sum+Number(row.amount||0),0),selectedExpense=selectedRows.filter(row=>row.type!=="income").reduce((sum,row)=>sum+Number(row.amount||0),0);

      if(event.target.closest("[data-cancel-trade]")){ui.editingTradeId="";render();return} if(event.target.closest("[data-cancel-dividend]")){ui.editingDividendId="";render();return} if(event.target.closest("[data-cancel-holding]")){ui.editingHoldingKey="";render();return}
      const deleteEntry=event.target.closest("[data-delete-entry]")?.dataset.deleteEntry;if(deleteEntry&&confirm("確定刪除這筆收支？刪除前會建立還原點。")){FinanceCore.removeEntry(deleteEntry);showToast("收支已刪除");refresh();return}
      const deleteTransfer=event.target.closest("[data-delete-transfer]")?.dataset.deleteTransfer;if(deleteTransfer&&confirm("確定刪除這筆轉帳？若為卡費繳款，帳單會恢復待繳。")){FinanceCore.removeTransfer(deleteTransfer);showToast("轉帳已刪除");refresh();return}
      const deleteBill=event.target.closest("[data-delete-bill]")?.dataset.deleteBill;if(deleteBill&&confirm("確定刪除這筆帳單及其繳款連動？")){FinanceCore.removeCreditBill(deleteBill);showToast("帳單已刪除");refresh();return}
      const deleteBudget=event.target.closest("[data-delete-budget]")?.dataset.deleteBudget;if(deleteBudget&&confirm("確定刪除這筆分類預算？")){FinanceCore.removeBudget(deleteBudget);showToast("預算已刪除");refresh();return}
      const deleteRecurring=event.target.closest("[data-delete-recurring]")?.dataset.deleteRecurring;if(deleteRecurring&&confirm("確定刪除這筆固定收支規則？")){FinanceCore.removeRecurring(deleteRecurring);showToast("固定收支已刪除");refresh();return}
      const deleteInstallment=event.target.closest("[data-delete-installment]")?.dataset.deleteInstallment;if(deleteInstallment&&confirm("確定刪除這筆信用卡分期？")){FinanceCore.removeInstallment(deleteInstallment);showToast("分期已刪除");refresh();return}
      const deleteReconcile=event.target.closest("[data-delete-reconcile]")?.dataset.deleteReconcile;if(deleteReconcile&&confirm("撤回盤點並刪除其差額調整？")){FinanceCore.removeReconciliation(deleteReconcile);showToast("盤點已撤回");refresh();return}
      const deleteStatement=event.target.closest("[data-delete-statement]")?.dataset.deleteStatement;if(deleteStatement&&confirm("確定刪除這筆卡片對帳紀錄？")){FinanceCore.removeCreditStatementCheck(deleteStatement);showToast("對帳紀錄已刪除");refresh();return}
      const closeMonth=event.target.closest("[data-close-month]")?.dataset.closeMonth;if(closeMonth){FinanceCore.closeMonth(closeMonth);showToast(`${closeMonth} 月結已完成`);refresh();return}
      const reopenMonth=event.target.closest("[data-reopen-month]")?.dataset.reopenMonth;if(reopenMonth&&confirm(`確定重新開啟 ${reopenMonth}？既有資料不會被刪除。`)){FinanceCore.reopenMonth(reopenMonth);showToast("月份已重新開啟");refresh();return}
      const deleteTrade=event.target.closest("[data-delete-trade]")?.dataset.deleteTrade;if(deleteTrade&&confirm("確定刪除這筆投資交易？現金帳戶會同步回復。")){FinanceCore.removePurchase(deleteTrade);showToast("投資交易已刪除");refresh();return}
      const deleteDividend=event.target.closest("[data-delete-dividend]")?.dataset.deleteDividend;if(deleteDividend&&confirm("確定刪除這筆股息？")){FinanceCore.removeDividend(deleteDividend);showToast("股息已刪除");refresh();return}
      const deleteHolding=event.target.closest("[data-delete-holding]")?.dataset.deleteHolding;if(deleteHolding&&confirm("確定刪除這筆持倉？")){const [assetClass,id]=deleteHolding.split(":");FinanceCore.removeHolding(assetClass,id);showToast("持倉已刪除");refresh();return}
      const syncHolding=event.target.closest("[data-sync-holding]")?.dataset.syncHolding;if(syncHolding&&confirm("要以交易淨股數同步舊持倉嗎？原始股數會保留在備援欄位。")){FinanceCore.syncLegacyHolding(syncHolding);showToast("舊持倉已與交易結果同步");refresh();return}
      if(event.target.closest("[data-create-snapshot]")){FinanceCore.addAssetSnapshot();showToast("已建立今日資產快照");refresh();return}
      const toggleBill=event.target.closest("[data-toggle-bill]");if(toggleBill){FinanceCore.setCreditBillPaid(toggleBill.dataset.toggleBill,toggleBill.dataset.paid!=="0"?false:true);showToast(toggleBill.dataset.paid==="0"?"已建立信用卡繳款轉帳":"已取消繳款紀錄");refresh();return}
      if(event.target.closest("[data-create-backup]")){FinanceCore.createBackup("手動建立還原點");showToast("已建立可還原的資料快照");render();return}
      if(event.target.closest("[data-export]")){download(`tsubin-finance-center-${FinanceCore.localDate()}.json`,JSON.stringify(FinanceCore.exportBundle(),null,2));showToast("已匯出完整財務存檔");return}
      if(event.target.closest("[data-import]")){document.getElementById("importFile").click();return}
      const restore=event.target.closest("[data-restore-backup]")?.dataset.restoreBackup;if(restore&&confirm("確定要還原這個版本嗎？目前資料會先自動備份。")){FinanceCore.restoreBackup(restore);showToast("資料已還原");refresh()}
    });
    document.addEventListener("submit", event => {
      event.preventDefault(); const values=formValues(event.target);
      try {
        if(event.target.id==="entryFilterForm"){ui.filters={...ui.filters,...values};render();return}
        if(event.target.id==="quickEntryForm") { values.id?FinanceCore.updateEntry(values.id,values):FinanceCore.addEntry(values); ui.editingEntryId=""; }
        if(event.target.id==="transferForm") { values.id?FinanceCore.updateTransfer(values.id,values):FinanceCore.addTransfer(values); ui.editingTransferId=""; }
        if(event.target.id==="tradeForm") { values.id?FinanceCore.updatePurchase(values.id,values):FinanceCore.addPurchase(values); ui.editingTradeId=""; }
        if(event.target.id==="dividendForm") { values.id?FinanceCore.updateDividend(values.id,values):FinanceCore.addDividend(values); ui.editingDividendId=""; }
        if(event.target.id==="accountForm") { values.id?FinanceCore.updateAccount(values.id,values):FinanceCore.addAccount(values); ui.editingAccountId=""; }
        if(event.target.id==="creditBillForm") { values.id?FinanceCore.updateCreditBill(values.id,values):FinanceCore.addCreditBill(values); ui.editingBillId=""; }
        if(event.target.id==="budgetForm") { FinanceCore.upsertBudget(values); ui.editingBudgetId=""; }
        if(event.target.id==="recurringForm") { values.id?FinanceCore.updateRecurring(values.id,values):FinanceCore.addRecurring(values); ui.editingRecurringId=""; }
        if(event.target.id==="installmentForm") { values.id?FinanceCore.updateInstallment(values.id,values):FinanceCore.addInstallment(values); ui.editingInstallmentId=""; }
        if(event.target.id==="reconcileForm") FinanceCore.addReconciliation(values);
        if(event.target.id==="statementCheckForm") FinanceCore.saveCreditStatementCheck(values);
        if(event.target.id==="holdingForm") { values.id?FinanceCore.updateHolding(values.originalClass,values.id,values):FinanceCore.addHolding(values); ui.editingHoldingKey=""; }
        showToast("已儲存並同步更新財務總覽");refresh();
      } catch(error){showToast(error.message||"儲存失敗")}
    });
    document.getElementById("importFile").addEventListener("change",async event=>{const file=event.target.files?.[0];if(!file)return;try{const payload=JSON.parse(await file.text());FinanceCore.importBundle(payload);showToast("已匯入，原資料已建立還原點");refresh()}catch(error){showToast(error.message||"匯入失敗")}finally{event.target.value=""}});
    function setPrivacy(enabled, notify = true) { state.privacy = Boolean(enabled); document.body.classList.toggle("privacy", state.privacy); if (notify) showToast(state.privacy ? "金額已隱藏" : "金額已顯示"); }
    function armPrivacyTimer() { clearTimeout(privacyTimer); if (!state.privacy) privacyTimer = setTimeout(() => setPrivacy(true, true), 300000); }
    document.getElementById("privacyToggle").addEventListener("click",()=>{setPrivacy(!state.privacy);armPrivacyTimer()});
    ["pointerdown","keydown","touchstart"].forEach(type=>document.addEventListener(type,armPrivacyTimer,{passive:true}));
    window.addEventListener("finance-core-change",()=>{clearTimeout(cloudSaveTimer);if(cloudUser)cloudSaveTimer=setTimeout(()=>saveCloud(true),1800)});
    window.addEventListener("storage",event=>{if([FinanceCore.KEYS.ledger,FinanceCore.KEYS.assets].includes(event.key))refresh();if(event.key==="tsubin-assets-auth")refreshCloudSession({force:true})});
    window.addEventListener("hashchange",readRoute);
    document.addEventListener("visibilitychange",()=>{if(document.hidden&&!state.privacy)setPrivacy(true,false);if(!document.hidden)refreshCloudSession({force:true})});
    async function publicConfig(){const fallback={supabaseUrl:window.SUPABASE_URL||window.PUBLIC_CONFIG?.supabaseUrl||window.APP_CONFIG?.supabaseUrl||"",supabaseAnonKey:window.SUPABASE_ANON_KEY||window.PUBLIC_CONFIG?.supabaseAnonKey||window.APP_CONFIG?.supabaseAnonKey||""};if(!location.protocol.startsWith("http"))return fallback;try{const response=await fetch(`/api/public-config?ts=${Date.now()}`,{cache:"no-store"});if(!response.ok)return fallback;const config=await response.json();return{supabaseUrl:fallback.supabaseUrl||config.supabaseUrl||config.SUPABASE_URL||"",supabaseAnonKey:fallback.supabaseAnonKey||config.supabaseAnonKey||config.SUPABASE_ANON_KEY||""}}catch{return fallback}}
    function cloudRedirectUrl(){if(!location.protocol.startsWith("http")||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))return "https://assets-olive-ten.vercel.app/finance-center.html";return `${location.origin}${location.pathname}`}
    function cleanCloudAuthUrl(){if(hasCloudAuthCallback())history.replaceState(null,"",location.pathname)}
    function updateCloudUi(message,stateName="offline") { const status=document.getElementById("cloudStatus");status.textContent=message;status.dataset.state=stateName;status.title=cloudUser?.email?`已登入：${cloudUser.email}｜點擊重新驗證`:stateName==="checking"?"正在驗證登入狀態":"目前未登入｜點擊重新檢查";status.setAttribute("aria-label",status.title);["cloudSave","cloudLoad","cloudLogout"].forEach(id=>document.getElementById(id).hidden=!cloudUser);const login=document.getElementById("cloudLogin");login.hidden=Boolean(cloudUser);login.disabled=!cloudReady&&!cloudUser; }
    function authCallbackError(){const query=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.replace(/^#/,""));return query.get("error_description")||hash.get("error_description")||query.get("error")||hash.get("error")||""}
    async function refreshCloudSession({notify=false,force=false}={}){if(!supabaseClient||!cloudReady)return false;const now=Date.now();if(!force&&now-lastCloudSessionCheck<4000)return Boolean(cloudUser);lastCloudSessionCheck=now;updateCloudUi("… 驗證登入中","checking");try{const callbackError=authCallbackError();if(callbackError)throw new Error(decodeURIComponent(callbackError.replace(/\+/g," ")));let {data,error}=await supabaseClient.auth.getSession();if(error)throw error;if(!data.session){const code=new URLSearchParams(location.search).get("code");if(code){const exchanged=await supabaseClient.auth.exchangeCodeForSession(code);if(exchanged.error)throw exchanged.error;data={session:exchanged.data.session}}}cloudUser=data.session?.user||null;if(cloudUser){try{const verified=await supabaseClient.auth.getUser();if(verified.data?.user)cloudUser=verified.data.user}catch{}cleanCloudAuthUrl();updateCloudUi("✓ 已登入","online");if(notify)showToast(`已登入：${cloudUser.email||"Email 帳號"}`);return true}updateCloudUi("● 未登入","offline");if(notify)showToast("目前尚未登入，請重新寄送登入連結");return false}catch(error){const hadCallback=hasCloudAuthCallback();cloudUser=null;const detail=/verifier/i.test(error.message||"")?"請在寄出登入信的同一個瀏覽器開啟連結":error.message||"請重新寄送登入連結";updateCloudUi("! 登入驗證失敗","error");if(notify||hadCallback)showToast(`登入驗證失敗：${detail}`);if(hadCallback)cleanCloudAuthUrl();return false}}
    function migrateLegacyAuthSession(config){try{if(localStorage.getItem("tsubin-assets-auth"))return;const projectRef=new URL(config.supabaseUrl).hostname.split(".")[0],legacyKey=`sb-${projectRef}-auth-token`,legacy=localStorage.getItem(legacyKey);if(!legacy)return;const parsed=JSON.parse(legacy);if(parsed?.access_token&&parsed?.refresh_token)localStorage.setItem("tsubin-assets-auth",legacy)}catch{}}
    async function initCloud(){if(!window.supabase?.createClient){updateCloudUi("! 登入元件未載入","error");return}updateCloudUi("… 雲端連線中","checking");try{const config=await publicConfig();if(!config.supabaseUrl||!config.supabaseAnonKey){updateCloudUi("! 雲端未設定","error");return}migrateLegacyAuthSession(config);supabaseClient=supabase.createClient(config.supabaseUrl,config.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"tsubin-assets-auth"}});cloudReady=true;supabaseClient.auth.onAuthStateChange((event,session)=>{cloudUser=session?.user||null;if(cloudUser){cleanCloudAuthUrl();updateCloudUi("✓ 已登入","online");if(event==="SIGNED_IN")showToast(`Email 登入成功${cloudUser.email?`：${cloudUser.email}`:""}`)}else if(event==="SIGNED_OUT")updateCloudUi("● 未登入","offline")});await refreshCloudSession({force:true})}catch(error){cloudReady=false;updateCloudUi("! 雲端連線錯誤","error");showToast(`登入服務初始化失敗：${error.message||"請稍後再試"}`)}}
    function openCloudLoginDialog(){const dialog=document.getElementById("cloudLoginDialog"),email=document.getElementById("cloudEmail").value.trim();document.getElementById("cloudDialogEmail").value=email;if(typeof dialog.showModal==="function")dialog.showModal();else{const fallback=prompt("請輸入 Email",email);if(fallback)sendCloudLogin(fallback)}}
    async function sendCloudLogin(email){if(!supabaseClient||!cloudReady){showToast("雲端連線尚未完成，請重新整理後再試");return false}const normalized=String(email||"").trim();if(!/^\S+@\S+\.\S+$/.test(normalized)){showToast("請輸入有效的 Email");return false}const button=document.getElementById("cloudLoginSend");button.disabled=true;button.textContent="寄送中…";try{const {error}=await supabaseClient.auth.signInWithOtp({email:normalized,options:{emailRedirectTo:cloudRedirectUrl(),shouldCreateUser:true}});if(error)throw error;document.getElementById("cloudEmail").value=normalized;updateCloudUi("✉ 請查看信箱","checking");showToast("登入連結已寄出，請到信箱確認");return true}catch(error){updateCloudUi("! 寄送失敗","error");showToast(`登入信寄送失敗：${error.message||"請稍後再試"}`);return false}finally{button.disabled=false;button.textContent="寄送登入連結"}}
    async function loginCloud(){const email=document.getElementById("cloudEmail").value.trim();if(!email||matchMedia("(max-width:1100px)").matches){openCloudLoginDialog();return}await sendCloudLogin(email)}
    async function saveCloud(silent=false){if(!supabaseClient||!cloudUser)return;const bundle=FinanceCore.exportBundle();const data={...bundle.assets,accountingLedger:bundle.ledger,financeCenterMeta:{schemaVersion:bundle.schemaVersion,updatedAt:bundle.updatedAt,deviceId:bundle.deviceId}};const {error}=await supabaseClient.from("asset_dashboard_profiles").upsert({user_id:cloudUser.id,data,updated_at:new Date().toISOString()});if(!silent)showToast(error?`雲端儲存失敗：${error.message}`:"完整財務資料已儲存到雲端")}
    async function loadCloud(){if(!supabaseClient||!cloudUser)return;const {data:row,error}=await supabaseClient.from("asset_dashboard_profiles").select("data,updated_at").eq("user_id",cloudUser.id).maybeSingle();if(error||!row?.data){showToast(error?.message||"雲端目前沒有存檔");return}const remoteTime=new Date(row.updated_at).getTime();const localTime=new Date(current.updatedAt).getTime();if(remoteTime<localTime&&!confirm("本機資料比雲端新，仍要載入雲端版本嗎？目前本機資料會先備份。"))return;const {accountingLedger,...assetPayload}=row.data;FinanceCore.importBundle({assets:assetPayload,ledger:accountingLedger});showToast("已載入雲端資料並建立本機還原點");refresh()}
    document.getElementById("cloudLogin").addEventListener("click",loginCloud);document.getElementById("cloudLoginCancel").addEventListener("click",()=>document.getElementById("cloudLoginDialog").close());document.getElementById("cloudLoginForm").addEventListener("submit",async event=>{event.preventDefault();if(await sendCloudLogin(document.getElementById("cloudDialogEmail").value))document.getElementById("cloudLoginDialog").close()});document.getElementById("cloudSave").addEventListener("click",()=>saveCloud(false));document.getElementById("cloudLoad").addEventListener("click",loadCloud);document.getElementById("cloudLogout").addEventListener("click",async()=>{await supabaseClient?.auth.signOut();cloudUser=null;updateCloudUi("● 未登入")});const cloudStatus=document.getElementById("cloudStatus");cloudStatus.addEventListener("click",()=>refreshCloudSession({notify:true,force:true}));cloudStatus.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();refreshCloudSession({notify:true,force:true})}});window.addEventListener("pageshow",()=>refreshCloudSession({force:true}));window.addEventListener("focus",()=>refreshCloudSession());
    FinanceCore.touch("財務中心啟動"); readRoute(); initCloud(); armPrivacyTimer();
    if("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js?v=90").catch(()=>{});
  </script>
