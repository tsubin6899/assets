<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>個人財務中心｜阿斌 Tsubin</title>
  <meta name="theme-color" content="#18243a">
  <meta name="application-name" content="個人財務中心">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <style>
    :root { color-scheme: light; --ink:#18243a; --muted:#69778c; --line:#d7e0eb; --blue:#3478f6; --green:#20b486; --purple:#8667d8; --bg:#eef3f8; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { color: var(--ink); font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; background: radial-gradient(circle at 8% 0%, rgba(102,166,247,.20), transparent 28%), radial-gradient(circle at 92% 12%, rgba(32,180,134,.16), transparent 26%), var(--bg); }
    .center-shell { min-height: 100vh; padding: 14px; }
    .center-header { width: min(1560px, 100%); margin: 0 auto 12px; padding: 9px 14px 10px; border-radius: 14px; color: #fff; background: linear-gradient(118deg, #18243a 0%, #3158c9 50%, #168b87 100%); box-shadow: 0 10px 24px rgba(24,36,58,.16); }
    .brand-row { display:grid; grid-template-columns:minmax(240px,1fr) minmax(0,auto); align-items:center; gap:18px; }
    .brand-copy { min-width: 0; display:flex; align-items:center; gap:10px; }
    .kicker { display:none; }
    h1 { margin:0; font-size: clamp(18px, 2.2vw, 23px); white-space:nowrap; }
    .sub { display:none; }
    .sync-note { padding:6px 9px; border:1px solid rgba(255,255,255,.2); border-radius:9px; color:rgba(255,255,255,.82); background:rgba(255,255,255,.1); font-size:11px; white-space:nowrap; }
    .top-controls { display:flex; align-items:center; justify-content:flex-end; gap:6px; min-width:0; overflow:auto; }
    .auth-strip, .utility-strip { display:flex; align-items:center; gap:6px; flex:0 0 auto; }
    .utility-strip { padding-left:8px; border-left:1px solid rgba(255,255,255,.2); }
    .top-controls input { width:150px; min-width:150px; height:32px; padding:0 9px; border:1px solid rgba(255,255,255,.25); border-radius:8px; color:#fff; background:rgba(255,255,255,.12); outline:0; }
    .top-controls input::placeholder { color:rgba(255,255,255,.68); }
    .top-controls button { min-height:32px; padding:6px 10px; border:1px solid rgba(255,255,255,.18); border-radius:8px; color:#fff; background:rgba(255,255,255,.1); font:inherit; font-size:12px; font-weight:750; cursor:pointer; white-space:nowrap; }
    .top-controls button:hover { background:rgba(255,255,255,.2); }
    .top-controls button[data-center-action="login"], .top-controls button[data-center-action="updatePrices"] { background:#3478f6; }
    .top-controls button[data-center-action="save"] { background:#20b486; }
    .top-controls button[data-center-action="load"], .top-controls button[data-center-action="theme"] { background:#8667d8; }
    .top-controls button[data-center-action="privacy"] { background:#4b6ee8; }
    .top-controls button[data-center-action="dataManagement"] { background:#53627b; }
    .top-controls .tool-state { color:rgba(255,255,255,.72); font-size:11px; white-space:nowrap; }
    .center-nav { display:flex; align-items:center; gap:5px; overflow:auto; margin:0; padding-bottom:0; }
    .nav-group { flex:0 0 auto; margin-left:8px; padding-left:10px; border-left:1px solid rgba(255,255,255,.24); color:rgba(255,255,255,.62); font-size:11px; font-weight:800; writing-mode:vertical-rl; }
    .center-nav button { border:1px solid rgba(255,255,255,.17); border-radius:10px; padding:10px 14px; color:rgba(255,255,255,.78); background:rgba(255,255,255,.08); font:inherit; font-weight:750; cursor:pointer; white-space:nowrap; }
    .center-nav button:hover { background:rgba(255,255,255,.16); }
    .center-nav button.active { color:var(--ink); background:#fff; box-shadow:0 5px 15px rgba(0,0,0,.13); }
    .center-nav { width:100%; padding-top:9px; border-top:1px solid rgba(255,255,255,.16); }
    .workspace { width:min(1560px,100%); margin:0 auto; }
    .frame-wrap { overflow:hidden; min-height:calc(100vh - 108px); border:1px solid var(--line); border-radius:18px; background:#fff; box-shadow:0 12px 30px rgba(24,36,58,.10); }
    iframe { display:block; width:100%; height:calc(100vh - 108px); min-height:760px; border:0; background:#eef3f8; }
    .shortcut { margin:10px 0 0; color:var(--muted); font-size:12px; text-align:right; }
    @media (max-width:720px) { .center-shell{padding:0 0 10px;} .center-header{border-radius:0 0 16px 16px; padding:9px 10px;} .brand-row{display:flex; flex-wrap:wrap;} .brand-copy{flex:1 1 auto;} .center-nav{order:3; flex:1 0 100%; justify-content:flex-start;} .center-tools{margin-top:7px;} .center-tools input{width:128px;min-width:128px;} .tool-state{display:none;} .sync-note{display:none;} .frame-wrap{border-radius:0; border-left:0; border-right:0;} iframe{height:calc(100vh - 102px); min-height:760px;} .shortcut{padding:0 12px;} }
  </style>
</head>
<body>
  <main class="center-shell">
    <header class="center-header">
      <div class="brand-row">
        <div class="brand-copy"><div><div class="kicker">Personal Finance Center</div><h1>個人財務中心</h1><p class="sub">資產、記帳、帳戶、投資與報表集中在同一個入口。</p></div></div>
        <div class="top-controls">
          <div class="auth-strip">
            <input id="centerCloudEmail" type="email" placeholder="Email 登入同步" autocomplete="email">
            <button type="button" data-center-action="login">登入同步</button>
            <button type="button" data-center-action="save">儲存</button>
            <button type="button" data-center-action="load">載入</button>
            <button type="button" data-center-action="logout">登出</button>
            <span class="sync-note" id="syncNote">● 未登入</span>
          </div>
          <div class="utility-strip">
            <button type="button" data-center-action="updatePrices" data-assets-only>更新估值</button>
            <button type="button" data-center-action="privacy">隱私模式</button>
            <button type="button" data-center-action="theme">深色模式</button>
            <button type="button" data-center-action="dataManagement" data-assets-only>資料管理</button>
            <span class="tool-state" id="toolState">目前控制：記帳中心</span>
          </div>
        </div>
      </div>
      <nav class="center-nav" aria-label="財務中心導覽">
        <span class="nav-group">記帳</span>
        <button class="active" type="button" data-center-page="accounting:entryView">首頁</button>
        <button type="button" data-center-page="accounting:analyticsView">明細</button>
        <button type="button" data-center-page="accounting:accountView">帳戶</button>
        <button type="button" data-center-page="accounting:accountLedgerView">帳戶明細</button>
        <button type="button" data-center-page="accounting:transferView">轉帳</button>
        <button type="button" data-center-page="accounting:creditView">信用卡</button>
        <button type="button" data-center-page="accounting:creditReconcileView">對帳</button>
        <button type="button" data-center-page="accounting:recurringView">固定收支</button>
        <button type="button" data-center-page="accounting:categoryView">分類</button>
        <span class="nav-group">個人資產</span>
        <button type="button" data-center-page="assets:overview">總覽</button>
        <button type="button" data-center-page="assets:cash">現金</button>
        <button type="button" data-center-page="assets:tw">台股</button>
        <button type="button" data-center-page="assets:us">美股</button>
        <button type="button" data-center-page="assets:metal">貴金屬</button>
        <button type="button" data-center-page="assets:fund">基金</button>
        <button type="button" data-center-page="assets:dca">定期投入</button>
        <button type="button" data-center-page="assets:watchlist">觀察名單</button>
        <button type="button" data-center-page="assets:purchase">交易</button>
        <button type="button" data-center-page="assets:dividend">股息</button>
        <button type="button" data-center-page="assets:bookkeeping">記帳總覽</button>
        <button type="button" data-center-page="assets:expense">支出規畫</button>
        <button type="button" data-center-page="assets:allocation">資金分配</button>
        <button type="button" data-center-page="assets:annual">年度報表</button>
        <button type="button" data-center-page="assets:chart">圖表</button>
      </nav>
    </header>
    <section class="workspace" aria-label="財務中心內容">
      <div class="frame-wrap" id="mainFrameWrap"><iframe id="mainFrame" title="個人財務中心內容" src="accounting-app.html?embedded=1&amp;v=78#quick-entry"></iframe></div>
      <p class="shortcut">記帳與個人資產使用同一個財務中心、同一個瀏覽器資料來源與雲端同步資料。</p>
    </section>
  </main>
  <script>
    const mainFrame = document.getElementById("mainFrame");
    const emailInput = document.getElementById("centerCloudEmail");
    const toolState = document.getElementById("toolState");
    let activePage = "accounting:entryView";
    function sendToActive(message) { mainFrame.contentWindow?.postMessage(message, "*"); }
    function setEmbeddedShell() { sendToActive({ type: "finance-center-shell", compact: true }); }
    function setActiveButton(page) { document.querySelectorAll("[data-center-page]").forEach(item => item.classList.toggle("active", item.dataset.centerPage === page)); }
    function selectPage(page, { replace = false } = {}) {
      const [module, view] = page.split(":");
      activePage = page;
      setActiveButton(page);
      document.querySelectorAll("[data-assets-only]").forEach(item => item.hidden = module !== "assets");
      toolState.textContent = module === "assets" ? "目前控制：個人資產" : "目前控制：記帳中心";
      const target = module === "assets" ? `personal-assets-dashboard.html?embedded=1&v=78#${view}` : `accounting-app.html?embedded=1&v=78#${view === "entryView" ? "quick-entry" : view === "analyticsView" ? "analytics" : ""}`;
      if (mainFrame.dataset.module !== module) { mainFrame.dataset.module = module; mainFrame.src = target; }
      else sendToActive({ type: "finance-center-action", action: module === "assets" ? "tab" : "view", value: view });
      if (replace) history.replaceState(null, "", `#${page.replace(":", "-")}`);
    }
    mainFrame.addEventListener("load", () => { setEmbeddedShell(); const [module, view] = activePage.split(":"); setTimeout(() => sendToActive({ type: "finance-center-action", action: module === "assets" ? "tab" : "view", value: view }), 60); });
    window.addEventListener("message", event => {
      if (event.data?.type !== "finance-center-status") return;
      const loggedIn = Boolean(event.data.loggedIn);
      document.getElementById("syncNote").textContent = loggedIn ? "● 已登入" : "● 未登入";
    });
    document.querySelectorAll("[data-center-action]").forEach(button => button.addEventListener("click", () => {
      const action = button.dataset.centerAction;
      if (action === "login") sendToActive({ type: "finance-center-action", action, email: emailInput.value.trim() });
      else sendToActive({ type: "finance-center-action", action });
      toolState.textContent = action === "updatePrices" ? "正在更新市場資料…" : "工具已送出：" + button.textContent;
      setTimeout(() => { toolState.textContent = activePage.startsWith("assets:") ? "目前控制：個人資產" : "目前控制：記帳中心"; }, 1800);
    }));
    document.querySelectorAll("[data-center-page]").forEach(button => button.addEventListener("click", () => selectPage(button.dataset.centerPage, { replace: true })));
    const initialHash = location.hash.replace(/^#/, "");
    const initialPage = initialHash === "ledger" ? "accounting:entryView" : initialHash.startsWith("assets-") ? `assets:${initialHash.slice(7)}` : initialHash.startsWith("accounting-") ? `accounting:${initialHash.slice(10)}` : activePage;
    selectPage(initialPage, { replace: false });
    window.addEventListener("storage", event => {
      if (!["personal-assets-dashboard-tsubin-v2", "personal-accounting-tsubin-v1"].includes(event.key)) return;
      sendToActive({ type: "finance-center-refresh", key: event.key });
    });
  </script>
</body>
</html>
