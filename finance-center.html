<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>個人財務中心｜TSUBIN</title>
  <meta name="description" content="整合日常記帳、帳戶負債、投資資產、現金流與財務分析的個人財務中心。">
  <meta name="theme-color" content="#17284b">
  <meta name="application-name" content="個人財務中心">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <style>
    :root {
      color-scheme:light;
      --ink:#17223a; --muted:#6a778c; --line:#dce5ed; --surface:#fff; --canvas:#eef4f7;
      --navy:#17284b; --blue:#3979ed; --teal:#169b91; --green:#1eaa7d; --amber:#e5a13d; --coral:#e57361;
      --purple:#8066ce; --danger:#d65d57; --shadow:0 14px 36px rgba(25,50,80,.10);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--canvas)}
    body{min-height:100%;margin:0;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:radial-gradient(circle at 92% 4%,rgba(62,199,176,.16),transparent 25rem),linear-gradient(135deg,#edf4fb,#f5f7f4 55%,#edf9f5)}
    body.privacy .money-value{filter:blur(9px);user-select:none}
    button,input,select,textarea{font:inherit}
    button,a{touch-action:manipulation}
    a{color:inherit;text-decoration:none}
    h1,h2,h3,p{margin:0}
    button{cursor:pointer}
    .app-header{position:sticky;top:0;z-index:100;color:#fff;background:linear-gradient(112deg,#142546,#285dca 55%,#138d8a);box-shadow:0 8px 26px rgba(17,38,72,.18)}
    .brand-row{display:flex;align-items:center;justify-content:space-between;gap:24px;width:min(1500px,calc(100% - 40px));min-height:100px;margin:auto}
    .brand{display:flex;align-items:center;gap:14px;min-width:0}
    .brand-mark{display:grid;place-items:center;width:46px;height:46px;flex:0 0 46px;border:1px solid rgba(255,255,255,.22);border-radius:15px;background:rgba(255,255,255,.12);box-shadow:inset 0 1px rgba(255,255,255,.15)}
    .brand-mark svg{width:25px;height:25px}
    .brand h1{font-size:clamp(28px,2.35vw,37px);line-height:1;white-space:nowrap}
    .brand h1 span{color:rgba(255,255,255,.62);font-size:.66em;letter-spacing:.08em}
    .brand p{margin-top:8px;color:rgba(255,255,255,.66);font-size:12px}
    .header-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;min-width:0}
    .cloud-email{width:170px;height:38px;padding:0 12px;border:1px solid rgba(255,255,255,.24);border-radius:10px;color:#fff;background:rgba(255,255,255,.10);outline:none}
    .cloud-email::placeholder{color:rgba(255,255,255,.62)}
    .header-btn,.status-pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:7px 11px;border:1px solid rgba(255,255,255,.16);border-radius:10px;color:#fff;background:rgba(255,255,255,.10);font-size:12px;font-weight:800;white-space:nowrap}
    .header-btn:hover{background:rgba(255,255,255,.19)}
    .header-btn.login{background:#3d79ed}.header-btn.save{background:#159a71}.header-btn.load{background:#7659c9}
    .status-pill{border-radius:999px;color:rgba(255,255,255,.86);background:rgba(11,27,52,.24)}
    .status-pill[data-state="online"]{color:#c8ffe9;background:rgba(9,102,74,.38)}
    .primary-nav{display:flex;align-items:center;gap:6px;width:100%;padding:7px max(20px,calc((100vw - 1500px)/2));border-top:1px solid rgba(255,255,255,.12);background:rgba(8,27,59,.18);overflow-x:auto;scrollbar-width:none}
    .primary-nav::-webkit-scrollbar,.secondary-track::-webkit-scrollbar{display:none}
    .primary-nav button{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:0 0 auto;min-width:132px;min-height:43px;padding:0 17px;border:1px solid rgba(255,255,255,.10);border-radius:12px;color:rgba(255,255,255,.76);background:rgba(255,255,255,.035);font-weight:850;white-space:nowrap}
    .primary-nav button:hover{color:#fff;background:rgba(255,255,255,.11)}
    .primary-nav button.active{color:#17284b;border-color:#fff;background:#fff;box-shadow:0 8px 20px rgba(8,24,52,.22)}
    .primary-nav svg{width:18px;height:18px}
    .secondary-nav{position:sticky;top:157px;z-index:80;border-bottom:1px solid rgba(210,222,232,.9);background:rgba(248,251,252,.90);backdrop-filter:blur(14px)}
    .secondary-track{display:flex;align-items:center;gap:7px;width:min(1500px,calc(100% - 40px));min-height:54px;margin:auto;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
    .secondary-track button,.secondary-track a{flex:0 0 auto;scroll-snap-align:center;min-height:34px;padding:7px 13px;border:1px solid transparent;border-radius:10px;color:#59687d;background:transparent;font-size:13px;font-weight:750;white-space:nowrap}
    .secondary-track button:hover,.secondary-track button.active{color:#285dca;border-color:#cfe0f7;background:#eaf2ff}
    .secondary-track a{margin-left:auto;color:#53627b;border-color:#d8e1ea;background:#fff}
    .page{width:min(1500px,calc(100% - 40px));margin:0 auto;padding:24px 0 112px}
    .page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
    .page-heading h2{font-size:27px;letter-spacing:-.02em}
    .page-heading p{margin-top:7px;color:var(--muted);font-size:13px}
    .eyebrow{display:block;margin-bottom:5px;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    .grid{display:grid;gap:16px}
    .home-grid{grid-template-columns:minmax(0,1.65fr) minmax(320px,.85fr)}
    .two-col{grid-template-columns:repeat(2,minmax(0,1fr))}
    .three-col{grid-template-columns:repeat(3,minmax(0,1fr))}
    .four-col{grid-template-columns:repeat(4,minmax(0,1fr))}
    .panel,.metric-card,.alert-card,.account-card{border:1px solid rgba(213,225,234,.92);border-radius:var(--radius);background:rgba(255,255,255,.92);box-shadow:var(--shadow)}
    .panel{padding:20px}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
    .panel-head h3{font-size:18px}
    .panel-head p{margin-top:4px;color:var(--muted);font-size:12px}
    .hero-card{position:relative;overflow:hidden;min-height:295px;padding:25px;border:0;border-radius:22px;color:#fff;background:linear-gradient(128deg,#18344a,#174152 55%,#155965);box-shadow:0 20px 46px rgba(20,58,72,.20)}
    .hero-card::after{content:"";position:absolute;right:-55px;top:-85px;width:245px;height:245px;border-radius:50%;background:rgba(111,213,188,.12)}
    .hero-top{position:relative;z-index:1;display:flex;justify-content:space-between;gap:20px}
    .hero-label{color:#b7d7d2;font-size:12px;font-weight:800}
    .net-worth{margin-top:9px;font-size:clamp(38px,4vw,58px);line-height:1;font-weight:500;letter-spacing:-.03em}
    .delta{display:inline-flex;align-items:center;gap:5px;margin-top:11px;color:#8de3c7;font-size:13px;font-weight:850}
    .hero-actions{position:relative;z-index:1;display:flex;gap:9px;margin-top:22px}
    .action-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:9px 14px;border:1px solid #dce5ed;border-radius:11px;color:#24324a;background:#fff;font-weight:800}
    .action-btn.secondary{color:#fff;border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.08)}
    .action-btn.blue{color:#fff;border-color:#3979ed;background:#3979ed}.action-btn.green{color:#fff;border-color:#1eaa7d;background:#1eaa7d}.action-btn.danger{color:#fff;border-color:#d65d57;background:#d65d57}
    .hero-metrics{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:20px}
    .hero-metrics div{padding:10px 12px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(255,255,255,.06)}
    .hero-metrics span{display:block;color:#a9c5c7;font-size:10px}.hero-metrics strong{display:block;margin-top:4px;font-size:14px}
    .metric-card{position:relative;overflow:hidden;padding:17px 18px;border-top:4px solid var(--tone,var(--blue))}
    .metric-card span{color:var(--muted);font-size:12px}.metric-card strong{display:block;margin-top:7px;font-size:26px;line-height:1.1}.metric-card small{display:block;margin-top:6px;color:#8590a0;font-size:11px}
    .tone-green{--tone:var(--green)}.tone-coral{--tone:var(--coral)}.tone-purple{--tone:var(--purple)}.tone-amber{--tone:var(--amber)}.tone-teal{--tone:var(--teal)}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .form-grid .wide{grid-column:1/-1}
    label{display:grid;gap:6px;color:#59667a;font-size:12px;font-weight:750}
    input,select,textarea{width:100%;min-height:42px;padding:9px 11px;border:1px solid #d5dfe8;border-radius:10px;color:var(--ink);background:#fff;outline:none}
    textarea{min-height:76px;resize:vertical}
    input:focus,select:focus,textarea:focus{border-color:#6c9bf2;box-shadow:0 0 0 3px rgba(57,121,237,.12)}
    .segmented{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:13px;padding:4px;border:1px solid #dbe4e8;border-radius:11px;background:#eef4f1}
    .segmented label{display:block}
    .segmented input{position:absolute;opacity:0;pointer-events:none}
    .segmented span{display:block;padding:9px;border-radius:8px;text-align:center;color:#627083;font-weight:850;cursor:pointer}
    .segmented input:checked+span{color:#fff;background:var(--coral);box-shadow:0 6px 14px rgba(229,115,97,.2)}
    .segmented label:last-child input:checked+span{background:var(--green)}
    .alert-list{display:grid;gap:9px}
    .alert-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;padding:12px 13px;border-radius:13px;box-shadow:none}
    .alert-dot{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(57,121,237,.12)}
    .alert-card.warning .alert-dot{background:var(--amber);box-shadow:0 0 0 4px rgba(229,161,61,.14)}
    .alert-card.danger .alert-dot{background:var(--danger);box-shadow:0 0 0 4px rgba(214,93,87,.14)}
    .alert-card strong{display:block;font-size:13px}.alert-card small{display:block;margin-top:3px;color:var(--muted);font-size:11px}
    .status-chip{padding:4px 7px;border-radius:999px;color:#52647a;background:#eef3f6;font-size:10px;font-weight:800}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
    table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
    th,td{padding:11px 12px;border-bottom:1px solid #e7edf2;text-align:left;white-space:nowrap}
    th{color:#5c6c7e;background:#f4f7f8;font-size:11px}tr:last-child td{border-bottom:0}
    .positive{color:#168c68}.negative{color:#d45e55}.muted{color:var(--muted)}
    .account-card{padding:16px;border-top:4px solid var(--teal)}
    .account-card.credit{border-top-color:var(--purple)}
    .account-card .account-title{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .account-card h3{font-size:15px}.account-card p{margin-top:4px;color:var(--muted);font-size:11px}
    .account-card .balance{display:block;margin-top:15px;font-size:25px;font-weight:750}
    .allocation-list,.bar-list{display:grid;gap:12px}
    .allocation-row{display:grid;grid-template-columns:74px 1fr 76px;align-items:center;gap:11px;font-size:12px}
    .bar{height:9px;overflow:hidden;border-radius:999px;background:#e9eff3}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--teal))}
    .holding-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .holding{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
    .holding strong{font-size:14px}.holding span{display:block;margin-top:8px;font-size:20px;font-weight:750}.holding small{display:block;margin-top:4px;color:var(--muted)}
    .trend{display:flex;align-items:flex-end;gap:7px;height:150px;padding-top:12px}
    .trend-bar{position:relative;flex:1;min-width:10px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#64b8a6,#3979ed);opacity:.85}
    .trend-bar:hover{opacity:1}.trend-bar span{position:absolute;right:50%;bottom:-22px;transform:translateX(50%);color:#7b8797;font-size:9px;white-space:nowrap}
    .empty{padding:25px;border:1px dashed #ccd8e1;border-radius:14px;color:var(--muted);text-align:center;background:rgba(255,255,255,.55)}
    .backup-list{display:grid;gap:8px}.backup-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}.backup-row strong{font-size:12px}.backup-row small{display:block;margin-top:3px;color:var(--muted);font-size:10px}
    .toast{position:fixed;right:18px;bottom:18px;z-index:300;max-width:min(390px,calc(100vw - 36px));padding:12px 16px;border-radius:12px;color:#fff;background:#17284b;box-shadow:0 15px 32px rgba(15,32,61,.25);font-size:13px;opacity:0;transform:translateY(16px);pointer-events:none;transition:.2s}
    .toast.show{opacity:1;transform:none}
    .mobile-nav{display:none}
    .desktop-only{display:inline-flex}
    @media(max-width:1100px){.brand p{display:none}.cloud-email{display:none}.home-grid{grid-template-columns:1fr}.holding-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.four-col{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:760px){
      .app-header{position:sticky}.brand-row{width:100%;min-height:70px;padding:8px 12px}.brand-mark{width:38px;height:38px;flex-basis:38px;border-radius:12px}.brand-mark svg{width:21px}.brand h1{font-size:19px}.brand h1 span{display:none}
      .header-actions .save,.header-actions .load,.header-actions .logout,.desktop-only{display:none}.header-btn{padding-inline:9px}.status-pill{font-size:10px;padding-inline:8px}
      .primary-nav{display:none}.secondary-nav{top:70px}.secondary-track{width:100%;min-height:50px;padding:0 10px}.secondary-track a{display:none}
      .page{width:100%;padding:17px 12px 104px}.page-heading{align-items:flex-start}.page-heading h2{font-size:23px}.page-heading .action-btn{display:none}
      .two-col,.three-col,.four-col{grid-template-columns:1fr}.home-grid{grid-template-columns:1fr}.panel{padding:15px}.hero-card{min-height:0;padding:20px 16px}.hero-top{display:block}.net-worth{font-size:42px}.hero-metrics{grid-template-columns:1fr}.metric-card strong{font-size:23px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.holding-grid{grid-template-columns:1fr 1fr}.allocation-row{grid-template-columns:58px 1fr 66px}.table-wrap{border:0}
      table,thead,tbody,tr,th,td{display:block}thead{display:none}tr{margin-bottom:9px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}td{display:flex;justify-content:space-between;gap:12px;padding:6px 4px;border:0;white-space:normal;text-align:right}td::before{content:attr(data-label);color:var(--muted);font-size:11px;text-align:left}
      .mobile-nav{position:fixed;right:8px;bottom:max(8px,env(safe-area-inset-bottom));left:8px;z-index:220;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;height:76px;padding:7px;border:1px solid rgba(255,255,255,.8);border-radius:22px;background:rgba(255,253,247,.95);box-shadow:0 16px 36px rgba(16,34,61,.26);backdrop-filter:blur(16px)}
      .mobile-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:15px;color:#526076;background:transparent;font-size:10px;font-weight:800}.mobile-nav svg{width:21px;height:21px}.mobile-nav button.active{color:#fff;background:linear-gradient(145deg,#17284b,#2b4778);box-shadow:0 8px 17px rgba(23,40,75,.25)}
      .toast{bottom:96px}
    }
    @media(max-width:390px){.brand{gap:8px}.brand-mark{display:none}.header-actions{gap:4px}.header-btn.login{font-size:11px}.holding-grid{grid-template-columns:1fr}.hero-actions{display:grid;grid-template-columns:1fr 1fr}.action-btn{padding-inline:8px}}
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand-row">
      <div class="brand">
        <span class="brand-mark"><i data-lucide="landmark"></i></span>
        <div><h1>個人財務中心 <span>┃ TSUBIN</span></h1><p>記帳、帳戶、投資、負債與分析，共用同一份財務資料。</p></div>
      </div>
      <div class="header-actions">
        <input class="cloud-email" id="cloudEmail" type="email" placeholder="Email 登入同步" autocomplete="email">
        <button class="header-btn login" id="cloudLogin" type="button">登入同步</button>
        <button class="header-btn save" id="cloudSave" type="button" hidden>儲存</button>
        <button class="header-btn load" id="cloudLoad" type="button" hidden>載入</button>
        <button class="header-btn logout" id="cloudLogout" type="button" hidden>登出</button>
        <span class="status-pill" id="cloudStatus" data-state="offline">● 本機</span>
        <button class="header-btn" id="privacyToggle" type="button" title="隱藏金額"><i data-lucide="eye-off"></i><span class="desktop-only">隱私</span></button>
      </div>
    </div>
    <nav class="primary-nav" aria-label="主要功能">
      <button type="button" data-domain="home"><i data-lucide="home"></i>首頁</button>
      <button type="button" data-domain="daily"><i data-lucide="notebook-tabs"></i>日常記帳</button>
      <button type="button" data-domain="accounts"><i data-lucide="wallet-cards"></i>帳戶與負債</button>
      <button type="button" data-domain="investments"><i data-lucide="chart-candlestick"></i>投資資產</button>
      <button type="button" data-domain="analysis"><i data-lucide="chart-no-axes-combined"></i>分析與報表</button>
    </nav>
  </header>
  <nav class="secondary-nav" aria-label="目前領域分頁"><div class="secondary-track" id="secondaryNav"></div></nav>
  <main class="page" id="app" tabindex="-1"></main>
  <nav class="mobile-nav" aria-label="手機主要功能">
    <button type="button" data-domain="home"><i data-lucide="home"></i><span>首頁</span></button>
    <button type="button" data-domain="daily"><i data-lucide="notebook-tabs"></i><span>記帳</span></button>
    <button type="button" data-domain="accounts"><i data-lucide="wallet-cards"></i><span>帳戶</span></button>
    <button type="button" data-domain="investments"><i data-lucide="chart-candlestick"></i><span>資產</span></button>
    <button type="button" data-domain="analysis"><i data-lucide="chart-no-axes-combined"></i><span>分析</span></button>
  </nav>
  <input id="importFile" type="file" accept="application/json" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="market-data-config.js"></script>
  <script src="finance-core.js?v=1"></script>
  <script>
    const app = document.getElementById("app");
    const secondaryNav = document.getElementById("secondaryNav");
    const routes = {
      home: { label: "首頁", tabs: [["overview","今日總覽"],["actions","行動中心"]], legacy: "" },
      daily: { label: "日常記帳", tabs: [["quick","快速記帳"],["records","收支明細"],["budgets","分類預算"]], legacy: "accounting-app.html" },
      accounts: { label: "帳戶與負債", tabs: [["accounts","帳戶總覽"],["transfer","帳戶轉帳"],["credit","信用卡帳單"]], legacy: "accounting-app.html#accountView" },
      investments: { label: "投資資產", tabs: [["portfolio","資產配置"],["holdings","持有部位"],["trades","交易紀錄"],["dividends","股息收入"]], legacy: "personal-assets-dashboard.html" },
      analysis: { label: "分析與報表", tabs: [["trends","資產趨勢"],["spending","支出分析"],["events","財務事件"],["data","資料管理"]], legacy: "personal-assets-dashboard.html#annual" }
    };
    let state = { domain: "home", tab: "overview", privacy: false };
    let current = FinanceCore.insights();
    let toastTimer = 0;
    let supabaseClient = null;
    let cloudUser = null;
    let cloudSaveTimer = 0;
    let privacyTimer = 0;

    function esc(value) { return String(value ?? "").replace(/[&<>'"]/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;" })[char]); }
    function money(value, currency = "TWD") { return `${currency === "TWD" ? "NT$" : esc(currency)} ${Math.round(Number(value) || 0).toLocaleString("zh-TW")}`; }
    function signed(value) { const n = Math.round(Number(value) || 0); return `${n >= 0 ? "+" : "−"}${Math.abs(n).toLocaleString("zh-TW")}`; }
    function pct(value) { return `${Math.round((Number(value) || 0) * 10) / 10}%`; }
    function dateTime(value) { try { return new Intl.DateTimeFormat("zh-TW", { dateStyle:"medium", timeStyle:"short" }).format(new Date(value)); } catch { return value || ""; } }
    function showToast(message) { const node = document.getElementById("toast"); node.textContent = message; node.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => node.classList.remove("show"), 2300); }
    function option(value, label, selected) { return `<option value="${esc(value)}" ${String(value) === String(selected) ? "selected" : ""}>${esc(label)}</option>`; }

    function snapshotBars() {

      if (!rows.length) return `<div class="empty">建立資產快照後，這裡會顯示最近 12 次淨資產變化。</div>`;
      const values = rows.map(row => Number(row.net ?? row.total) || 0); const min = Math.min(...values); const max = Math.max(...values); const span = Math.max(1,max-min);

    function renderHome() {
      const a = current.assetsSummary, m = current.month, avg = current.averageMonthlyExpense;

    }
    function categoryBars() { const rows=Object.entries(current.month.categorySpend).sort((a,b)=>b[1]-a[1]); const max=rows[0]?.[1]||1; return rows.length?`<div class="bar-list">${rows.map(([key,value])=>`<div class="allocation-row"><strong>${esc(key)}</strong><div class="bar"><i style="width:${value/max*100}%;background:linear-gradient(90deg,var(--coral),var(--amber))"></i></div><span class="money-value">${Math.round(value).toLocaleString()}</span></div>`).join("")}</div>`:`<div class="empty">本月尚無支出資料。</div>`; }
    function backupRows() { const rows=FinanceCore.listBackups(); return rows.length?`<div class="backup-list">${rows.map(row=>`<div class="backup-row"><div><strong>${esc(row.reason)}</strong><small>${dateTime(row.createdAt)}｜資料版本 ${row.schemaVersion}</small></div><button class="action-btn" data-restore-backup="${esc(row.id)}">還原</button></div>`).join("")}</div>`:`<div class="empty">尚未建立還原點。</div>`; }
    function renderAnalysis() {
      const head=pageHeading("Financial Intelligence",state.tab==="trends"?"資產趨勢":state.tab==="spending"?"支出分析":state.tab==="events"?"統一財務事件":"資料管理","分析會說明原因與下一步，而不只是增加圖表。",`<a class="action-btn" href="personal-assets-dashboard.html#chart">開啟完整報表 ↗</a>`);
      if(state.tab==="trends") return `${head}<div class="four-col grid">${metric("目前淨資產",money(current.assetsSummary.netWorth),"資產－負債","tone-blue")}${metric("本月現金流",money(current.month.balance),"收入－一般支出",current.month.balance>=0?"tone-green":"tone-coral")}${metric("平均月支出",money(current.averageMonthlyExpense),"最近有資料的 3 個月","tone-amber")}${metric("現金安全月數",current.averageMonthlyExpense?`${(current.assetsSummary.cash/current.averageMonthlyExpense).toFixed(1)} 個月`:"待設定","建議至少 6 個月","tone-teal")}</div><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>淨資產快照</h3><p>用於辨識長期方向與資產波動</p></div></div>${snapshotBars()}</section><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>診斷與建議</h3><p>由預算、帳單、安全水位與配置自動產生</p></div></div>${alertList(current.alerts)}</section>`;
      if(state.tab==="spending") return `${head}<div class="two-col grid"><section class="panel"><div class="panel-head"><div><h3>${esc(current.month.month)} 支出分類</h3><p>只計算一般支出，不含轉帳與投資</p></div></div>${categoryBars()}</section><section class="panel"><div class="panel-head"><div><h3>預算狀態</h3><p>達 80% 提醒、100% 標示超支</p></div></div>${alertList(current.alerts.filter(row=>/預算/.test(row.title)))}</section></div>`;
      if(state.tab==="events") return `${head}<section class="panel"><div class="panel-head"><div><h3>跨模組財務事件</h3><p>收入、支出、轉帳、投資買賣與股息共用一致格式</p></div></div>${eventRows(current.events.slice(0,80))}</section>`;
      return `${head}<div class="two-col grid"><section class="panel"><div class="panel-head"><div><h3>備份與還原</h3><p>重大修改與匯入前會自動建立還原點；自動備份不含大型發票照片。</p></div><button class="action-btn" data-create-backup>立即建立</button></div>${backupRows()}</section><section class="grid"><section class="panel"><div class="panel-head"><div><h3>完整存檔</h3><p>JSON 可完整保留記帳與資產資料</p></div></div><div class="grid"><button class="action-btn blue" data-export>匯出完整存檔</button><button class="action-btn" data-import>匯入完整存檔</button></div></section><section class="panel"><div class="panel-head"><div><h3>資料健康</h3><p>統一資料層版本與同步資訊</p></div></div><div class="alert-list"><article class="alert-card"><i class="alert-dot"></i><div><strong>資料版本 ${FinanceCore.VERSION}</strong><small>舊版記帳與資產存檔已自動相容</small></div><span class="status-chip">正常</span></article><article class="alert-card"><i class="alert-dot"></i><div><strong>${current.events.length} 筆財務事件</strong><small>最後更新 ${dateTime(current.updatedAt)}</small></div><span class="status-chip">已整合</span></article><article class="alert-card"><i class="alert-dot"></i><div><strong>裝置識別已建立</strong><small>用於判斷同步來源與衝突</small></div><span class="status-chip">安全</span></article></div></section></section></div>`;
    }
    function render() {
      current = FinanceCore.insights();
      const renderer = { home:renderHome, daily:renderDaily, accounts:renderAccounts, investments:renderInvestments, analysis:renderAnalysis }[state.domain] || renderHome;
      app.innerHTML = renderer();
      document.querySelectorAll("[data-domain]").forEach(node=>node.classList.toggle("active",node.dataset.domain===state.domain));
      if(window.lucide) lucide.createIcons();
    }
    function formValues(form) { return Object.fromEntries(new FormData(form).entries()); }
    function download(name,data,type="application/json") { const blob=new Blob([data],{type});const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000); }
    document.addEventListener("click", event => {
      const domain=event.target.closest("[data-domain]")?.dataset.domain;if(domain){setRoute(domain);return}
      const tab=event.target.closest("[data-tab]")?.dataset.tab;if(tab){setRoute(state.domain,tab);return}
      const go=event.target.closest("[data-go]")?.dataset.go;if(go){const [d,t]=go.split("/");setRoute(d,t);return}
      if(event.target.closest("[data-create-backup]")){FinanceCore.createBackup("手動建立還原點");showToast("已建立可還原的資料快照");render();return}
      if(event.target.closest("[data-export]")){download(`tsubin-finance-center-${FinanceCore.localDate()}.json`,JSON.stringify(FinanceCore.exportBundle(),null,2));showToast("已匯出完整財務存檔");return}
      if(event.target.closest("[data-import]")){document.getElementById("importFile").click();return}
      const restore=event.target.closest("[data-restore-backup]")?.dataset.restoreBackup;if(restore&&confirm("確定要還原這個版本嗎？目前資料會先自動備份。")){FinanceCore.restoreBackup(restore);showToast("資料已還原");refresh()}
    });
    document.addEventListener("submit", event => {
      event.preventDefault(); const values=formValues(event.target);
      try {
        if(event.target.id==="quickEntryForm") FinanceCore.addEntry(values);
        if(event.target.id==="transferForm") FinanceCore.addTransfer(values);
        if(event.target.id==="tradeForm") FinanceCore.addPurchase(values);
        if(event.target.id==="dividendForm") FinanceCore.addDividend(values);
        if(event.target.id==="accountForm") FinanceCore.addAccount(values);
        showToast("已儲存並同步更新財務總覽");refresh();
      } catch(error){showToast(error.message||"儲存失敗")}
    });
    document.getElementById("importFile").addEventListener("change",async event=>{const file=event.target.files?.[0];if(!file)return;try{const payload=JSON.parse(await file.text());FinanceCore.importBundle(payload);showToast("已匯入，原資料已建立還原點");refresh()}catch(error){showToast(error.message||"匯入失敗")}finally{event.target.value=""}});
    function setPrivacy(enabled, notify = true) { state.privacy = Boolean(enabled); document.body.classList.toggle("privacy", state.privacy); if (notify) showToast(state.privacy ? "金額已隱藏" : "金額已顯示"); }
    function armPrivacyTimer() { clearTimeout(privacyTimer); if (!state.privacy) privacyTimer = setTimeout(() => setPrivacy(true, true), 300000); }
    document.getElementById("privacyToggle").addEventListener("click",()=>{setPrivacy(!state.privacy);armPrivacyTimer()});
    ["pointerdown","keydown","touchstart"].forEach(type=>document.addEventListener(type,armPrivacyTimer,{passive:true}));
    window.addEventListener("finance-core-change",()=>{clearTimeout(cloudSaveTimer);if(cloudUser)cloudSaveTimer=setTimeout(()=>saveCloud(true),1800)});
    window.addEventListener("storage",event=>{if([FinanceCore.KEYS.ledger,FinanceCore.KEYS.assets].includes(event.key))refresh()});
    window.addEventListener("hashchange",readRoute);
    document.addEventListener("visibilitychange",()=>{if(document.hidden&&!state.privacy)setPrivacy(true,false)});
    async function publicConfig(){try{const response=await fetch(`api/public-config?ts=${Date.now()}`,{cache:"no-store"});if(response.ok)return await response.json()}catch{}return window.PUBLIC_CONFIG||window.APP_CONFIG||{supabaseUrl:window.SUPABASE_URL||"",supabaseAnonKey:window.SUPABASE_ANON_KEY||""}}
    function updateCloudUi(message,stateName="offline") { const status=document.getElementById("cloudStatus");status.textContent=message;status.dataset.state=stateName;["cloudSave","cloudLoad","cloudLogout"].forEach(id=>document.getElementById(id).hidden=!cloudUser);document.getElementById("cloudLogin").hidden=Boolean(cloudUser); }
    async function initCloud(){if(!window.supabase)return;const config=await publicConfig();const url=config.supabaseUrl||config.SUPABASE_URL;const key=config.supabaseAnonKey||config.SUPABASE_ANON_KEY;if(!url||!key)return;supabaseClient=supabase.createClient(url,key);const {data}=await supabaseClient.auth.getSession();cloudUser=data.session?.user||null;updateCloudUi(cloudUser?"● 已登入":"● 本機",cloudUser?"online":"offline");supabaseClient.auth.onAuthStateChange((_event,session)=>{cloudUser=session?.user||null;updateCloudUi(cloudUser?"● 已登入":"● 本機",cloudUser?"online":"offline")})}
    async function loginCloud(){if(!supabaseClient){showToast("雲端服務尚未設定");return}const email=document.getElementById("cloudEmail").value.trim();if(!email){showToast("請先輸入 Email");return}const {error}=await supabaseClient.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split("#")[0]}});showToast(error?error.message:"登入連結已寄到 Email")}
    async function saveCloud(silent=false){if(!supabaseClient||!cloudUser)return;const bundle=FinanceCore.exportBundle();const data={...bundle.assets,accountingLedger:bundle.ledger,financeCenterMeta:{schemaVersion:bundle.schemaVersion,updatedAt:bundle.updatedAt,deviceId:bundle.deviceId}};const {error}=await supabaseClient.from("asset_dashboard_profiles").upsert({user_id:cloudUser.id,data,updated_at:new Date().toISOString()});if(!silent)showToast(error?`雲端儲存失敗：${error.message}`:"完整財務資料已儲存到雲端")}
    async function loadCloud(){if(!supabaseClient||!cloudUser)return;const {data:row,error}=await supabaseClient.from("asset_dashboard_profiles").select("data,updated_at").eq("user_id",cloudUser.id).maybeSingle();if(error||!row?.data){showToast(error?.message||"雲端目前沒有存檔");return}const remoteTime=new Date(row.updated_at).getTime();const localTime=new Date(current.updatedAt).getTime();if(remoteTime<localTime&&!confirm("本機資料比雲端新，仍要載入雲端版本嗎？目前本機資料會先備份。"))return;const {accountingLedger,...assetPayload}=row.data;FinanceCore.importBundle({assets:assetPayload,ledger:accountingLedger});showToast("已載入雲端資料並建立本機還原點");refresh()}
    document.getElementById("cloudLogin").addEventListener("click",loginCloud);document.getElementById("cloudSave").addEventListener("click",()=>saveCloud(false));document.getElementById("cloudLoad").addEventListener("click",loadCloud);document.getElementById("cloudLogout").addEventListener("click",async()=>{await supabaseClient?.auth.signOut();cloudUser=null;updateCloudUi("● 本機")});
    FinanceCore.touch("財務中心啟動"); readRoute(); initCloud(); armPrivacyTimer();
    if("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js?v=86").catch(()=>{});
  </script>
</body>
</html>
