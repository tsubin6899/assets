name: Update market data

on:
  workflow_dispatch:
    inputs:
      symbols_json:
        description: "Current dashboard symbols, including watchlists"
        required: false
        type: string
  schedule:
    - cron: "30 5 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply requested symbol list
        if: ${{ inputs.symbols_json != '' }}
        env:
          SYMBOLS_JSON: ${{ inputs.symbols_json }}
        run: python -c "import os; from pathlib import Path; Path('price-symbols.json').write_text(os.environ['SYMBOLS_JSON'], encoding='utf-8')"

      - name: Fetch prices, exchange rates, and valuations
        run: python update_prices.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-symbols.json latest-prices.json latest-rates.json latest-valuations.json
          git diff --cached --quiet && exit 0
          git commit -m "Update market data"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
